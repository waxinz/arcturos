<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcturos</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 960px; color: #1a1a1a; background: #fafafa; }
    header { border-bottom: 2px solid #222; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: #666; margin-top: .25rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #e5e5e5;
             font-size: .9rem; }
    th { font-weight: 600; color: #444; }
    td.mono { font-family: ui-monospace, monospace; font-size: .82rem; }
    .status { color: #666; font-size: .85rem; margin-top: .75rem; }
    nav a { margin-right: 1rem; color: #1a1a1a; text-decoration: none; font-weight: 600; }
    nav a.active { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Arcturos</h1>
    <div class="sub">Local-first LLM benchmarking &amp; evaluation dashboard</div>
    <nav>
      <a href="/" class="active">Runs</a>
      <a href="/compare">Compare</a>
      <a href="/diff">Diff</a>
    </nav>
  </header>

  <h2>Runs</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Server</th><th>Model fingerprint</th>
        <th>Engine</th><th>Context size</th><th>Created (UTC)</th>
      </tr>
    </thead>
    <tbody id="runs-body"></tbody>
  </table>
  <p id="status" class="status">Loading…</p>

  <script>
    async function loadRuns() {
      const status = document.getElementById('status');
      const tbody = document.getElementById('runs-body');
      try {
        const res = await fetch('/api/runs');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const runs = await res.json();
        if (!runs.length) { status.textContent = 'No runs recorded yet.'; return; }
        for (const r of runs) {
          const tr = document.createElement('tr');
          const cells = [
            r.id, r.server_url, r.model_fingerprint,
            r.engine, r.context_size, r.created_at
          ];
          for (const c of cells) {
            const td = document.createElement('td');
            td.textContent = c;
            td.className = (c === r.server_url || c === r.model_fingerprint) ? 'mono' : '';
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        status.textContent = runs.length + ' run(s).';
      } catch (err) {
        status.textContent = 'Failed to load runs: ' + err;
      }
    }
    loadRuns();
  </script>
</body>
</html>
