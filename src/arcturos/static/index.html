<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 960px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    table { border-collapse: collapse; width: 100%; background: var(--surface); }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border);
             font-size: .9rem; }
    th { font-weight: 600; color: var(--text-soft); }
    td.mono { font-family: ui-monospace, monospace; font-size: .82rem; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .col-check { width: 2rem; text-align: center; }
    td.col-check { text-align: center; }
    h2 button { margin-left: .5rem; font-size: .8rem; padding: .3rem .7rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .linklike { background: none; border: none; color: var(--link); font-size: .8rem;
                 padding: 0; cursor: pointer; text-decoration: underline; }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="runs" data-section="Benchmarks">
  <aside class="sidebar">
    <a class="brand" href="/">Arcturos</a>
    <span class="brand-sub">LLM benchmark &amp; eval dashboard</span>
    <nav>
      <div class="nav-section" data-nav-section="Benchmarks">
        <div class="nav-section-head">Benchmarks</div>
        <a href="/kickoff" data-page="kickoff">Kick off</a>
        <a href="/" data-page="runs">Runs</a>
        <a href="/compare" data-page="compare">Compare</a>
        <a href="/diff" data-page="diff">Run diff</a>
      </div>
      <div class="nav-section" data-nav-section="Evals">
        <div class="nav-section-head">Evals</div>
        <a href="/evals/suites/new" data-page="evalsuite">Suite create</a>
        <a href="/evals" data-page="evals">Results</a>
        <a href="/judgments" data-page="judgments">Judgments</a>
        <a href="/reports" data-page="reports">Reports</a>
      </div>
      <div class="nav-section" data-nav-section="Settings">
        <div class="nav-section-head">Settings</div>
        <a href="/models" data-page="models">Models</a>
        <a href="/baselines" data-page="baselines">Baselines</a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-toggle-inline" data-theme-toggle>☾</button>
    </div>
  </aside>

  <main class="page">
  <h2>Runs
    <button id="export-runs" title="Download all runs as CSV">⤓ CSV</button>
    <button id="hide-selected" disabled title="Hide every checked run from list views (append-only flag; unhide any time)">Hide selected</button>
  </h2>
  <table>
    <thead>
      <tr>
        <th class="col-check"><input type="checkbox" id="runs-select-all" aria-label="Select all runs"></th>
        <th>ID</th><th>Name</th><th>Server</th><th>Model fingerprint</th>
        <th>Engine</th><th>Context size</th><th>Created</th><th></th>
      </tr>
    </thead>
    <tbody id="runs-body"></tbody>
  </table>
  <p id="status" class="status">Loading…</p>

  <script>
    async function loadRuns() {
      const status = document.getElementById('status');
      const tbody = document.getElementById('runs-body');
      try {
        const res = await fetch('/api/runs');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const runs = await res.json();
        if (!runs.length) { status.textContent = 'No runs recorded yet.'; return; }
        for (const r of runs) {
          const tr = document.createElement('tr');
          // Selection checkbox (2026-09-30): first cell, feeds the
          // Hide-selected bulk action in the header.
          const checkCell = document.createElement('td');
          checkCell.className = 'col-check';
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.dataset.runId = String(r.id);
          check.className = 'run-select';
          check.setAttribute('aria-label', 'Select run #' + r.id);
          check.addEventListener('change', updateHideSelected);
          checkCell.appendChild(check);
          tr.appendChild(checkCell);
          // Name: second column (2026-09-22). display_name = stored name
          // when set, else a computed 'host · model' label so legacy
          // unnamed runs still show a usable label (never a bare '—').
          const nameCell = document.createElement('td');
          nameCell.textContent = r.display_name || r.name || '—';
          const cells = [
            r.server_url, r.model_fingerprint,
            r.engine, r.context_size, fmtLocalTime(r.created_at)
          ];
          const first = document.createElement('td');
          const link = document.createElement('a');
          link.href = '/runs/' + r.id;
          link.textContent = r.id;
          first.appendChild(link);
          // Partial runs (2026-09-22): visible marker, never hidden — a
          // failed sweep's completed points are still real data.
          if (r.status === 'partial') {
            const badge = document.createElement('span');
            badge.textContent = ' ⚠ partial';
            badge.title = 'Sweep failed mid-way — completed points preserved';
            badge.style.color = 'var(--warn)';
            first.appendChild(badge);
          }
          tr.appendChild(first);
          tr.appendChild(nameCell);
          for (let i = 0; i < cells.length; i++) {
            const td = document.createElement('td');
            td.textContent = cells[i];
            td.className = (cells[i] === r.server_url || cells[i] === r.model_fingerprint) ? 'mono' : '';
            tr.appendChild(td);
          }
          const actions = document.createElement('td');
          const hideBtn = document.createElement('button');
          hideBtn.className = 'linklike';
          hideBtn.textContent = 'Hide';
          hideBtn.onclick = async () => {
            if (!window.confirm('Hide run #' + r.id + ' from list views? (append-only flag — nothing is deleted, unhide any time)')) return;
            const res = await fetch('/api/runs/' + r.id + '/visibility', {
              method: 'PUT', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({hidden: true})});
            if (res.ok) loadRuns();
            else status.textContent = 'Hide failed: HTTP ' + res.status;
          };
          actions.appendChild(hideBtn);
          tr.appendChild(actions);
          tbody.appendChild(tr);
        }
        status.textContent = runs.length + ' run(s).';
      } catch (err) {
        status.textContent = 'Failed to load runs: ' + err;
      }
    }
    document.getElementById('export-runs').addEventListener('click', () => {
      window.location = '/api/export/runs';
    });

    // ---- bulk selection + Hide selected (2026-09-30) ------------------
    const hideSelectedBtn = document.getElementById('hide-selected');

    function updateHideSelected() {
      const boxes = Array.from(document.querySelectorAll('.run-select'));
      const picked = boxes.filter(b => b.checked).length;
      hideSelectedBtn.disabled = picked === 0;
      hideSelectedBtn.textContent = picked
        ? 'Hide selected (' + picked + ')'
        : 'Hide selected';
      const all = document.getElementById('runs-select-all');
      if (all) {
        all.checked = boxes.length > 0 && picked === boxes.length;
        all.indeterminate = picked > 0 && picked < boxes.length;
      }
    }

    document.getElementById('runs-select-all').addEventListener('change', (ev) => {
      const want = ev.target.checked;
      document.querySelectorAll('.run-select').forEach(b => { b.checked = want; });
      updateHideSelected();
    });

    hideSelectedBtn.addEventListener('click', async () => {
      const ids = Array.from(document.querySelectorAll('.run-select'))
        .filter(b => b.checked)
        .map(b => parseInt(b.dataset.runId, 10));
      if (!ids.length) return;
      const noun = ids.length === 1 ? 'run' : 'runs';
      if (!window.confirm('Hide ' + ids.length + ' ' + noun + ' (#' + ids.join(', #') +
          ') from list views? Append-only flag — nothing is deleted; unhide any time.')) return;
      const results = await Promise.allSettled(ids.map(id =>
        fetch('/api/runs/' + id + '/visibility', {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({hidden: true})}).then(r => ({id, ok: r.ok, status: r.status}))
      ));
      const settled = results.map(r => r.value).filter(Boolean);
      const ok = settled.filter(r => r.ok);
      const failed = settled.filter(r => !r.ok);
      const status = document.getElementById('status');
      if (failed.length) {
        status.textContent = 'Hide failed for ' + failed.map(r => '#' + r.id + ' (' + r.status + ')').join(', ') +
          (ok.length ? ' — ' + ok.length + ' hidden.' : '');
      } else {
        status.textContent = '✔ Hid ' + ok.length + ' ' + noun + '.';
      }
      loadRuns();
    });

    loadRuns();
  </script>
  </main>

</body>
</html>
