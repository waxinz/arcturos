<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcturos — Run detail</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 960px; color: #1a1a1a; background: #fafafa; }
    header { border-bottom: 2px solid #222; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: #666; margin-top: .25rem; }
    nav a { margin-right: 1rem; color: #1a1a1a; text-decoration: none; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; background: #fff; margin-top: 1rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #e5e5e5;
             font-size: .9rem; }
    th { font-weight: 600; color: #444; }
    td.mono { font-family: ui-monospace, monospace; font-size: .82rem; }
    .meta { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px;
            padding: .8rem 1rem; margin-top: 1rem; }
    .meta dt { font-weight: 600; font-size: .85rem; color: #444; margin-top: .4rem; }
    .meta dd { font-family: ui-monospace, monospace; font-size: .82rem;
               margin: 0 0 .2rem .8rem; word-break: break-all; }
    .status { color: #666; font-size: .85rem; margin-top: .75rem; }
    .empty { color: #666; padding: 2rem; text-align: center; }
    .null { color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>Arcturos</h1>
    <div class="sub">Local-first LLM benchmarking &amp; evaluation dashboard</div>
    <nav>
      <a href="/" class="active">Runs</a>
      <a href="/compare">Compare</a>
      <a href="/diff">Diff</a>
      <a href="/evals">Evals</a>
      <a href="/judgments">Judgments</a>
      <a href="/reports">Reports</a>
      <a href="/create">Create &amp; Run</a>
    </nav>
  </header>

  <h2 id="run-title">Run …</h2>
  <div id="run-meta" class="meta"></div>

  <h3>Benchmark points</h3>
  <table>
    <thead>
      <tr>
        <th>ctx tokens</th><th>prefill tok/s</th><th>decode tok/s</th>
        <th>TTFT ms</th><th>wall s</th><th>out tok</th>
        <th>MTP accept</th><th>power</th><th>created</th>
      </tr>
    </thead>
    <tbody id="points-body"></tbody>
  </table>
  <p id="status" class="status">Loading…</p>

  <script>
    const runId = location.pathname.split('/').pop();
    const fmt = (v) => (v === null || v === undefined) ? 'null' : String(v);

    async function load() {
      const status = document.getElementById('status');
      try {
        const res = await fetch('/api/runs/' + runId);
        if (!res.ok) throw new Error(await res.json().then(d => d.detail) || res.status);
        const run = await res.json();
        document.getElementById('run-title').textContent =
          'Run #' + run.id + ' — ' + (run.model_fingerprint || 'unknown model');
        document.getElementById('run-meta').innerHTML = `
          <dt>Server</dt><dd>${run.server_url || ''}</dd>
          <dt>Engine</dt><dd>${run.engine || ''}</dd>
          <dt>Context size</dt><dd>${run.context_size ?? 'null'}</dd>
          <dt>Created</dt><dd>${run.created_at || ''}</dd>`;

        const pres = await fetch('/api/runs/' + runId + '/benchmarks');
        const points = pres.ok ? await pres.json() : [];
        const tbody = document.getElementById('points-body');
        tbody.innerHTML = '';
        if (!points.length) {
          status.textContent = 'No benchmark points stored for this run yet.';
          return;
        }
        for (const p of points) {
          const tr = document.createElement('tr');
          const mtp = (p.mtp_accepted === null || p.mtp_draft_n === null)
            ? '<span class="null">null</span>'
            : p.mtp_accepted + '/' + p.mtp_draft_n;
          const power = p.power_watts === null
            ? '<span class="null">null</span>'
            : p.power_watts + ' W' + (p.power_host ? ' @ ' + p.power_host : '');
          const cells = [p.context_tokens, p.prefill_tps, p.decode_tps,
            p.ttft_ms, p.wall_s, p.output_tokens, mtp, power, p.created_at];
          for (const c of cells) {
            const td = document.createElement('td');
            td.innerHTML = c;
            td.className = 'mono';
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        status.textContent = points.length + ' point(s).';
      } catch (err) {
        status.textContent = 'Failed to load run: ' + err.message;
      }
    }
    load();
  </script>
</body>
</html>
