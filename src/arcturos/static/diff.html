<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos — Run Diff</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 1080px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .controls { margin: 1rem 0; display: flex; gap: 1.5rem; align-items: end; flex-wrap: wrap; }
    .controls label { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
    .controls select { margin-left: .4rem; padding: .3rem; font-size: .9rem; min-width: 260px; }
    button { padding: .45rem .9rem; font-size: .9rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; background: var(--surface); margin-bottom: 1.5rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--border);
             font-size: .88rem; }
    th { font-weight: 600; color: var(--text-soft); }
    th.ctx { width: 90px; }
    td.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
    td.num { text-align: right; font-family: ui-monospace, monospace; font-size: .8rem; }
    td.good { background: var(--good-bg); color: var(--good-text); font-weight: 600; }
    td.bad  { background: var(--bad-red-bg); color: var(--bad-red-text); font-weight: 600; }
    td.gray { color: var(--hint); }
    .meta { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
            padding: .8rem; margin-bottom: 1.2rem; }
    .meta h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .legend { color: var(--text-muted); font-size: .82rem; margin-bottom: .8rem; }
    .legend span { display: inline-block; padding: .1rem .45rem; margin-right: .5rem;
                   border-radius: 4px; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .empty { color: var(--text-muted); padding: 2rem; text-align: center; }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="diff" data-section="Benchmarks">
  <aside class="sidebar">
    <div class="brand-row">
      <span class="brand-tile" aria-hidden="true">A</span>
      <span class="brand-text">
        <a class="brand" href="/">Arcturos</a>
        <span class="brand-sub">LLM benchmark &amp; eval dashboard</span>
      </span>
    </div>
    <nav>
      <div class="nav-section" data-nav-section="Benchmarks">
        <div class="nav-section-head">Benchmarks</div>
        <a href="/kickoff" data-page="kickoff"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg><span class="nav-label">Start</span></a>
        <a href="/compare" data-page="compare"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-5"/></svg><span class="nav-label">Compare</span></a>
      </div>
      <div class="nav-section" data-nav-section="Evals">
        <div class="nav-section-head">Evals</div>
        <a href="/evals/suites/new" data-page="evalsuite"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M12 8.5v7M8.5 12h7"/></svg><span class="nav-label">Create</span></a>
        <a href="/evals" data-page="evals"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 6H21M8.5 12H21M8.5 18H21"/><path d="M3.5 6h1M3.5 12h1M3.5 18h1"/></svg><span class="nav-label">Results</span></a>
        <a href="/judgments" data-page="judgments"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.4 6 .9-4.3 4.2 1 6L12 17.2l-5.4 2.8 1-6L3.3 9.8l6-.9z"/></svg><span class="nav-label">Judgments</span></a>
        <a href="/reports" data-page="reports"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5H7a2 2 0 00-2 2v13a2 2 0 002 2h10a2 2 0 002-2V8.5z"/><path d="M14 3.5v5h5M9.5 13h5M9.5 16.5h5"/></svg><span class="nav-label">Reports</span></a>
      </div>
      <div class="nav-section" data-nav-section="Settings">
        <div class="nav-section-head">Settings</div>
        <a href="/models" data-page="models"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></svg><span class="nav-label">Models</span></a>
        <a href="/baselines" data-page="baselines"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 4.75L12 13 3.5 8.25z"/><path d="M4.5 12.5l7.5 4.25 7.5-4.25"/><path d="M4.5 16.5l7.5 4.25 7.5-4.25"/></svg><span class="nav-label">Baselines</span></a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-toggle-inline" data-theme-toggle>☾</button>
    </div>
  </aside>

  <main class="page">
  <h2>Run Diff</h2>

  <div class="controls">
    <label>Run A <select id="run-a"></select></label>
    <label>Run B <select id="run-b"></select></label>
    <button id="diff-btn" disabled>Diff</button>
  </div>

  <div id="result"></div>
  <p id="status" class="status"></p>

  <script>
    let runs = [];

    async function loadRuns() {
      const res = await fetch('/api/runs');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      runs = await res.json();
      for (const selId of ['run-a', 'run-b']) {
        const sel = document.getElementById(selId);
        sel.innerHTML = '';
        if (!runs.length) {
          sel.innerHTML = '<option>No runs yet</option>';
          continue;
        }
        for (const r of runs) {
          const opt = document.createElement('option');
          opt.value = r.id;
          // ID + Run Name (2026-09-30): the stored name (or computed label)
          // is what operators recognise; fingerprint stays in the diff body.
          const label = r.display_name || r.name || r.model_fingerprint;
          opt.textContent = '#' + r.id + ' — ' + label;
          sel.appendChild(opt);
        }
      }
      if (runs.length >= 2) {
        document.getElementById('run-a').selectedIndex = 0;
        document.getElementById('run-b').selectedIndex = 1;
        document.getElementById('diff-btn').disabled = false;
      }
    }

    function fmt(v) {
      if (v === null || v === undefined) return '—';
      if (typeof v === 'number') {
        if (Number.isInteger(v)) return String(v);
        return v.toFixed(2);
      }
      return String(v);
    }

    function deltaClass(direction, pct) {
      if (pct === null || pct === undefined || direction === 'neutral') return 'gray';
      if (Math.abs(pct) < 2) return 'gray';           // UX: gray within ±2%
      if (direction === 'higher') return pct > 0 ? 'good' : 'bad';
      return pct < 0 ? 'good' : 'bad';                 // lower is better
    }

    function metaTable(meta) {
      const rows = [
        ['n_ctx (context size)', 'n_ctx'],
        ['Model path', 'model_path'],
        ['Engine', 'engine'],
        ['Server URL', 'server_url']
      ];
      let html = '<table><thead><tr><th>Engine metadata</th><th>Run A</th>' +
                 '<th>Run B</th><th>Same</th></tr></thead><tbody>';
      for (const [label, key] of rows) {
        const d = meta[key];
        html += '<tr><td>' + label + '</td><td class="mono">' + fmt(d.a) + '</td>' +
                '<td class="mono">' + fmt(d.b) + '</td>' +
                '<td>' + (d.same ? 'yes' : 'no') + '</td></tr>';
      }
      return html + '</tbody></table>';
    }

    function deltaTable(data) {
      const dirs = data.directions || {};
      const metricNames = Object.keys(dirs);
      let html = '<table><thead><tr><th class="ctx">Context</th><th>Metric</th>' +
                 '<th class="num">Run A</th><th class="num">Run B</th>' +
                 '<th class="num">Δ</th><th class="num">Δ%</th></tr></thead><tbody>';
      for (const row of data.deltas) {
        for (const m of metricNames) {
          const d = row.metrics[m];
          const cls = deltaClass(dirs[m], d.pct);
          const deltaTxt = d.delta === null ? '—' : fmt(d.delta);
          const pctTxt = d.pct === null ? '—' : fmt(d.pct) + '%';
          html += '<tr><td class="ctx">' + row.context_tokens + '</td>' +
                  '<td>' + m + '</td>' +
                  '<td class="num">' + fmt(d.a) + '</td>' +
                  '<td class="num">' + fmt(d.b) + '</td>' +
                  '<td class="num ' + cls + '">' + deltaTxt + '</td>' +
                  '<td class="num ' + cls + '">' + pctTxt + '</td></tr>';
        }
      }
      return html + '</tbody></table>';
    }

    async function diff() {
      const status = document.getElementById('status');
      const box = document.getElementById('result');
      const a = document.getElementById('run-a').value;
      const b = document.getElementById('run-b').value;
      if (!a || !b || a === b) {
        status.textContent = 'Pick two different runs.';
        return;
      }
      box.innerHTML = '';
      status.textContent = 'Loading…';
      try {
        const res = await fetch('/api/compare/run-diff/' + a + '/' + b);
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const data = await res.json();
        box.innerHTML =
          '<div class="legend">Delta coloring: ' +
          '<span class="good">green = better</span>' +
          '<span class="bad">red = worse</span>' +
          '<span class="gray">gray = within ±2% / neutral</span>' +
          '(higher-is-better: decode/prefill tps, MTP acceptance, ' +
          'combined (Σ) tps; lower-is-better: TTFT, wall time)</div>' +
          '<div class="meta"><h3>Engine metadata</h3>' + metaTable(data.engine_metadata) + '</div>' +
          '<h3>Metrics — ' + (data.run_a.name || data.run_a.model_fingerprint_short) +
          ' vs ' + (data.run_b.name || data.run_b.model_fingerprint_short) + '</h3>' +
          deltaTable(data);
        status.textContent = 'Run #' + a + ' vs run #' + b + ' — deltas are B − A, pct relative to A.';
      } catch (err) {
        status.textContent = 'Failed to diff: ' + err;
      }
    }

    document.getElementById('diff-btn').addEventListener('click', diff);
    loadRuns().catch(err => {
      document.getElementById('status').textContent = 'Failed to load runs: ' + err;
    });
  </script>
  </main>

</body>
</html>
