<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <title>Arcturos — Judgment details</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    .page-sub { color: var(--text-muted); margin: .25rem 0 1rem; font-size: .9rem; }
    .meta { display: flex; flex-wrap: wrap; gap: .5rem 1.6rem; margin: 0 0 1rem;
            font-size: .9rem; }
    .meta b { color: var(--text-soft); font-weight: 600; }
    .sxs { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem;
           margin: 0 0 .6rem; }
    @media (max-width: 720px) { .sxs { grid-template-columns: 1fr; } }
    .resp { background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: .7rem .8rem; }
    .resp.winner { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .resp h4 { margin: 0 0 .4rem; font-size: .82rem; color: var(--text-soft);
               display: flex; justify-content: space-between; gap: .5rem;
               align-items: baseline; }
    .resp .win-tag { color: var(--accent); font-weight: 800; font-size: .74rem;
                     text-transform: uppercase; letter-spacing: .06em; }
    .resp pre { margin: 0; font-family: ui-monospace, monospace; font-size: .8rem;
                white-space: pre-wrap; word-break: break-word; max-height: 22rem;
                overflow-y: auto; }
    .verdict { background: var(--surface); border: 1px solid var(--border);
               border-radius: 6px; padding: .6rem .8rem; margin: 0 0 1.2rem;
               font-size: .85rem; }
    .verdict .v-head { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem;
                       color: var(--text-soft); font-weight: 600; }
    .verdict details { margin-top: .35rem; }
    .verdict summary { cursor: pointer; color: var(--link); font-size: .82rem; }
    .item-head { font-weight: 700; margin: 1.2rem 0 .45rem; font-size: .95rem;
                 display: flex; align-items: center; gap: .45rem; width: 100%;
                 background: none; border: 0; padding: .15rem .1rem;
                 cursor: pointer; color: var(--text); text-align: left;
                 font: inherit; font-weight: 700; font-size: .95rem; }
    .item-head .chev { color: var(--link); font-size: .82rem; width: 1em;
                       flex: none; }
    .item-head .item-name { word-break: break-word; }
    .item-head .hint { color: var(--text-muted); font-weight: 400;
                       font-size: .72rem; margin-left: .3rem; white-space: nowrap; }
    .item-head:focus-visible { outline: 2px solid var(--link);
                               outline-offset: 2px; border-radius: 4px; }
    .prompt-box { background: var(--surface); border: 1px solid var(--border);
                  border-radius: 6px; padding: .7rem .8rem;
                  margin: .1rem 0 .7rem; }
    .prompt-box[hidden] { display: none; }
    .prompt-box .p-label { font-size: .72rem; font-weight: 700;
                           text-transform: uppercase; letter-spacing: .06em;
                           color: var(--text-muted); margin: 0 0 .35rem; }
    .prompt-box .p-turn { font-size: .74rem; font-weight: 600;
                          color: var(--text-soft); margin: .55rem 0 .2rem; }
    .prompt-box pre { margin: 0; font-family: ui-monospace, monospace;
                      font-size: .8rem; white-space: pre-wrap;
                      word-break: break-word; }
    .prompt-box .p-sys pre { color: var(--text-muted); font-size: .76rem; }
    .prompt-box .p-note { color: var(--text-muted); font-size: .74rem;
                          margin: .4rem 0 0; }
    .prompt-box .p-img { margin-top: .5rem; }
    .prompt-box .p-img img { display: block; max-width: 100%;
                             max-height: 22rem; width: auto; height: auto;
                             border: 1px solid var(--border);
                             border-radius: 6px; background: var(--bg); }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .empty { color: var(--text-muted); padding: 2rem 0; }
    .tie-tag { color: var(--text-muted); font-weight: 800; font-size: .74rem;
               text-transform: uppercase; letter-spacing: .06em; }
    /* category summary card — leads the page, SxS details stay below */
    .jsum { background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: .7rem .8rem; margin: 0 0 1.1rem; }
    #jsum[hidden] { display: none; }
    .jsum h3 { margin: 0 0 .1rem; font-size: .9rem; }
    .jsum-cap { margin: 0 0 .55rem; color: var(--text-muted); font-size: .73rem; }
    .jsum .table-wrap { overflow-x: auto; }
    .jsum table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .jsum th, .jsum td { text-align: left; padding: .28rem .5rem;
                         border-bottom: 1px solid var(--border); }
    .jsum tbody tr:last-child td { border-bottom: 0; }
    .jsum th { color: var(--text-muted); font-weight: 600; font-size: .73rem; }
    .jsum th.num, .jsum td.num { text-align: right; }
    .jsum .score { font-weight: 700; }
    .jsum td.winner .score { color: var(--accent); }
    .jsum .sub { display: block; color: var(--text-muted); font-size: .7rem;
                 font-weight: 400; }
    .jsum tbody tr.total td { font-weight: 700; }
    .jsum tbody tr.total td .sub { font-weight: 400; }
    .jsum-tiles { display: none; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .jsum-tile { border: 1px solid var(--border); border-radius: 6px;
                 padding: .45rem .55rem; min-width: 0; }
    .jsum-tile .t-name { font-weight: 700; font-size: .76rem; margin: 0 0 .2rem;
                         word-break: break-word; }
    .jsum-tile .t-line { display: flex; flex-wrap: wrap; gap: .15rem .45rem;
                         font-size: .76rem; }
    .jsum-tile .t-vs { color: var(--text-muted); }
    .jsum-tile .t-win { color: var(--accent); font-weight: 700; }
    .jsum-tile .t-sub { color: var(--text-muted); font-size: .7rem; margin-top: .15rem; }
    @media (max-width: 720px) {
      .jsum .table-wrap { display: none; }   /* desktop table stays ≥721px */
      .jsum-tiles { display: grid; }
    }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/sticky-inputs.js"></script>
</head>
<body class="shell" data-page="jpair" data-section="Evals">
  <!--NAV-->

  <main class="page">
    <h1>Judgment details</h1>
    <p class="page-sub" id="sub">Side-by-side responses with the judge's verdict per item. Tap an item name to expand its prompt underneath.</p>
    <section id="jsum" class="jsum" hidden>
      <h3>Category summary</h3>
      <p class="jsum-cap">Blind pairwise score = wins + ½ ties, scaled 0–100 · both-bad counts as a tie · n per category</p>
      <div class="table-wrap"></div>
      <div class="jsum-tiles"></div>
    </section>
    <div class="meta" id="meta"></div>
    <div id="items"><p class="empty">Loading…</p></div>
    <p id="status" class="status"></p>
  </main>

  <script>
function $(id) { return document.getElementById(id); }

    function winnerTag(row, which) {
      const bothBad = row.winner === 'tie' && (row.verdict_detail || '') === 'both_bad';
      if (row.winner === which) return '<span class="win-tag">judge preferred</span>';
      if (bothBad) return '<span class="tie-tag">both bad (draw)</span>';
      if (row.winner === 'tie') return '<span class="tie-tag">tie</span>';
      return '';
    }

    function respCard(row, which) {
      const fp = which === 'a' ? row.fingerprint_a : row.fingerprint_b;
      const out = which === 'a' ? row.output_a : row.output_b;
      const div = document.createElement('div');
      div.className = 'resp' + (row.winner === which ? ' winner' : '');
      div.innerHTML = '<h4><span></span><span class="tag"></span></h4><pre></pre>';
      div.querySelector('h4 span').textContent = fp;
      div.querySelector('.tag').innerHTML = winnerTag(row, which);
      div.querySelector('pre').textContent =
        (out === null || out === undefined || out === '')
          ? '(empty output stored)' : out;
      return div;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g,
        c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
               "'": '&#39;'}[c]));
    }

    // ---- expandable prompt (tap the item name) --------------------------
    // Fills the collapsible panel under an item head with the case's
    // prompt from the suite's latest definition snapshot: system prompt,
    // the user prompt (single-turn) or per-turn user messages with the
    // assistant placeholders marked (multi-turn), plus the item's IMAGE
    // when it carries one — http(s) refs load directly, suite-relative
    // refs resolve through the guarded suite-image endpoint (base64).
    // Answers from both models stay in the SxS cards below the head.
    function fillPrompt(panel, item, suiteId) {
      panel.innerHTML = '';
      const lab = document.createElement('div');
      lab.className = 'p-label';
      lab.textContent = 'Prompt';
      panel.appendChild(lab);
      if (!item) {
        const pre = document.createElement('pre');
        pre.textContent = '(not in the current definition snapshot)';
        panel.appendChild(pre);
        return;
      }
      if (item.system) {
        const sys = document.createElement('div');
        sys.className = 'p-sys';
        const t = document.createElement('div');
        t.className = 'p-turn';
        t.textContent = 'System';
        const pre = document.createElement('pre');
        pre.textContent = item.system;
        sys.append(t, pre);
        panel.appendChild(sys);
      }
      if (Array.isArray(item.turns)) {
        let n = 0;
        for (const turn of item.turns) {
          const t = document.createElement('div');
          t.className = 'p-turn';
          const pre = document.createElement('pre');
          if (turn.role === 'user') {
            n += 1;
            t.textContent = 'Turn ' + n + ' · user';
            pre.textContent = turn.content ?? '(no content)';
          } else {
            t.textContent = 'model reply (stored below)';
            pre.textContent = '…';
          }
          panel.append(t, pre);
        }
      } else if (item.prompt) {
        const pre = document.createElement('pre');
        pre.textContent = item.prompt;
        panel.appendChild(pre);
      } else {
        const pre = document.createElement('pre');
        pre.textContent = '(no prompt stored)';
        panel.appendChild(pre);
      }
      if (item.image) {
        const isHttp = item.image.startsWith('http://') ||
                       item.image.startsWith('https://');
        const wrap = document.createElement('div');
        wrap.className = 'p-img';
        const img = document.createElement('img');
        img.alt = 'Item image: ' + item.image;
        img.loading = 'lazy';
        img.src = isHttp
          ? item.image
          : '/api/eval-suites/' + suiteId + '/image?item=' +
            encodeURIComponent(item.id);
        img.addEventListener('error', () => {
          wrap.innerHTML = '';
          const note = document.createElement('div');
          note.className = 'p-note';
          note.textContent = '⚠ image failed to load: ' + item.image;
          wrap.appendChild(note);
        });
        wrap.appendChild(img);
        panel.appendChild(wrap);
      }
    }

    function makeItemHead(base, defItems, suiteId) {
      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'item-head';
      head.setAttribute('aria-expanded', 'false');
      head.title = 'Tap to show / hide the prompt for this case';
      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '▸';
      const name = document.createElement('span');
      name.className = 'item-name';
      name.textContent = base;
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = 'tap for prompt';
      head.append(chev, name, hint);
      const panel = document.createElement('div');
      panel.className = 'prompt-box';
      panel.hidden = true;
      fillPrompt(panel, defItems[base] || null, suiteId);
      head.addEventListener('click', () => {
        const open = panel.hidden;
        panel.hidden = !open;
        chev.textContent = open ? '▾' : '▸';
        head.setAttribute('aria-expanded', String(open));
      });
      return [head, panel];
    }

    function shortFp(fp) {
      fp = String(fp || '');
      return fp.length > 18 ? fp.slice(0, 17) + '…' : fp;
    }

    function ciTitle(wilson) {
      // wilson_a is [lo, hi] in percent units (null when n = 0)
      return wilson ? 'Wilson 95%: ' + wilson[0] + '–' + wilson[1] + '%' : '';
    }

    function renderSummary(sum) {
      const card = $('jsum');
      if (!sum || !sum.total) { card.hidden = true; return; }
      const ma = shortFp(sum.model_a), mb = shortFp(sum.model_b);
      const rows = [sum.overall].concat(sum.rows || []);
      let trs = '';
      let tiles = '';
      for (const r of rows) {
        const isTotal = r.dimension === 'overall';
        const winA = r.score_a > r.score_b, winB = r.score_b > r.score_a;
        const wil = esc(ciTitle(r.wilson_a));
        trs += '<tr' + (isTotal ? ' class="total"' : '') + '>' +
          '<td>' + esc(r.dimension) + '</td>' +
          '<td' + (winA ? ' class="winner"' : '') + '>' +
            '<span class="score" title="' + wil + '">' + r.score_a + '</span>' +
            '<span class="sub">win ' + r.percent.a + '% · tie ' + r.percent.tie + '%' +
            (r.percent.both_bad ? ' · both-bad ' + r.percent.both_bad + '%' : '') + '</span></td>' +
          '<td' + (winB ? ' class="winner"' : '') + '>' +
            '<span class="score" title="' + wil + '">' + r.score_b + '</span>' +
            '<span class="sub">win ' + r.percent.b + '% · tie ' + r.percent.tie + '%' +
            (r.percent.both_bad ? ' · both-bad ' + r.percent.both_bad + '%' : '') + '</span></td>' +
          '<td class="num">' + r.n + '</td></tr>';
        tiles += '<div class="jsum-tile">' +
          '<div class="t-name">' + esc(r.dimension) + '</div>' +
          '<div class="t-line">' +
            '<span class="' + (winA ? 't-win' : 't-side') + '">' + esc(ma) + ': ' + r.score_a + '</span>' +
            '<span class="t-vs">vs</span>' +
            '<span class="' + (winB ? 't-win' : 't-side') + '">' + esc(mb) + ': ' + r.score_b + '</span>' +
          '</div>' +
          '<div class="t-sub">n ' + r.n + '</div></div>';
      }
      card.querySelector('.table-wrap').innerHTML =
        '<table><thead><tr><th>Category</th><th>' + esc(ma) + '</th><th>' +
        esc(mb) + '</th><th class="num">Judged</th></tr></thead><tbody>' +
        trs + '</tbody></table>';
      card.querySelector('.jsum-tiles').innerHTML = tiles;
      card.hidden = false;
    }

    function verdictCard(row) {
      const div = document.createElement('div');
      div.className = 'verdict';
      const head = document.createElement('div');
      head.className = 'v-head';
      const conf = row.confidence != null ? row.confidence : '—';
      head.innerHTML = '<span>#' + row.id + '</span>' +
        '<span>Winner: <b class="w"></b></span>' +
        '<span>Confidence: <b></b></span>' +
        '<span>Judge: <b></b></span>' +
        '<span class="v-present"></span>' +
        '<span>' + window.fmtLocalTime(row.created_at) + '</span>';
      head.querySelector('.w').textContent =
        row.winner === 'a' ? row.fingerprint_a
        : row.winner === 'b' ? row.fingerprint_b
        : ((row.verdict_detail || '') === 'both_bad' ? 'both bad' : 'tie');
      head.querySelectorAll('b')[1].textContent = String(conf);
      head.querySelectorAll('b')[2].textContent = row.judge_model;
      // Forensics: which stored side the judge saw as "Response 1". The
      // rationale's Response 1/2 labels refer to THAT order, not the cards
      // above — naming the model closes the gap that made audits guess.
      head.querySelector('.v-present').innerHTML = 'Judge saw first: <b></b>';
      head.querySelector('.v-present b').textContent =
        row.presentation === 'a_first' ? shortFp(row.fingerprint_a)
        : row.presentation === 'b_first' ? shortFp(row.fingerprint_b)
        : '(not recorded)';
      if (row.role === 'tiebreak') {
        const tb = document.createElement('span');
        tb.className = 'tie-tag';
        tb.textContent = 'tiebreak';
        head.append(tb);
      }
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = 'Judge rationale';
      const body = document.createElement('div');
      body.style.marginTop = '.3rem';
      body.textContent = row.rationale || '(no rationale stored)';
      det.append(sum, body);
      div.append(head, det);
      if (row.raw_reply) {
        const raw = document.createElement('details');
        const rawSum = document.createElement('summary');
        rawSum.textContent = 'Judge raw reply';
        const rawBody = document.createElement('div');
        rawBody.style.marginTop = '.3rem';
        rawBody.style.whiteSpace = 'pre-wrap';
        rawBody.textContent = row.raw_reply;
        raw.append(rawSum, rawBody);
        div.append(raw);
      }
      return div;
    }

    async function displayOrder(suiteId, ma, mb) {
      // Column order: the combined kick-off names its runs 'A: <model>'
      // and 'B: <model>'. Honor that labeling over URL order so the page
      // shows the run the operator kicked off as A on the LEFT. Falls
      // back to URL order when the runs carry no A/B naming.
      try {
        const rr = await fetch('/api/eval-runs');
        if (!rr.ok) return [ma, mb];
        const runs = await rr.json();
        const tagged = {};
        for (const r of runs) {
          if (r.suite_id !== Number(suiteId)) continue;
          const m = /^([AB]):\s+(.+)$/.exec(r.name || '');
          if (!m) continue;
          // the name segment is '<model> (judgements kick-off)' — a
          // contains-match is the robust check (suffix-tolerant)
          if (m[2].indexOf(String(r.model_fingerprint || '')) === -1) continue;
          if (!(r.model_fingerprint in tagged) || r.id > tagged[r.model_fingerprint].id) {
            tagged[r.model_fingerprint] = { tag: m[1], id: r.id };
          }
        }
        const ta = tagged[ma];
        const tb = tagged[mb];
        if (ta && tb && ta.tag !== tb.tag && ta.tag === 'B') return [mb, ma];
        return [ma, mb];
      } catch (err) {
        return [ma, mb];
      }
    }

    async function load() {
      const q = new URLSearchParams(location.search);
      const suiteId = q.get('suite_id');
      let ma = q.get('model_a') || '';
      let mb = q.get('model_b') || '';
      if (!suiteId || !ma || !mb) {
        $('items').innerHTML = '<p class="empty">Need ?suite_id=&model_a=&model_b= ' +
          '(select two runs on the Results page).</p>';
        return;
      }
      try {
        [ma, mb] = await displayOrder(suiteId, ma, mb);
        const pairQs = 'suite_id=' + suiteId +
                       '&model_a=' + encodeURIComponent(ma) +
                       '&model_b=' + encodeURIComponent(mb);
        // summary + rows in parallel; the summary card is optional — a
        // failed/404 summary just leaves the page with the existing UI.
        const [res, sumRes] = await Promise.all([
          fetch('/api/judgments/pair?' + pairQs),
          fetch('/api/judgments/pair/summary?' + pairQs).catch(() => null),
        ]);
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const rows = await res.json();
        // definition snapshot (optional too): feeds the expandable prompt
        // panels. 404/parse failure just leaves '(not in the current
        // definition snapshot)' inside the panel.
        const defItems = {};
        try {
          const dRes = await fetch('/api/eval-suites/' + suiteId + '/definition');
          if (dRes.ok) {
            const def = await dRes.json();
            for (const it of (def.items || [])) {
              if (it && it.id) defItems[it.id] = it;
            }
          }
        } catch (err) { /* prompt panels degrade gracefully */ }
        if (sumRes && sumRes.ok) {
          renderSummary(await sumRes.json());
        } else {
          $('jsum').hidden = true;
        }
        if (!rows.length) {
          $('items').innerHTML = '<p class="empty">No judgments for this pair yet. ' +
            'Select the two runs on the <a href="/evals">Results</a> page and press ' +
            '“Judgements”.</p>';
          return;
        }
        // Rows are stored canonically (fingerprint_a = slot A); map the
        // aggregate counts onto the DISPLAY order chosen above.
        const counts = {a: 0, b: 0, tie: 0};
        let bothBad = 0;
        for (const r of rows) {
          counts[r.winner] = (counts[r.winner] || 0) + 1;
          if (r.winner === 'tie' && (r.verdict_detail || '') === 'both_bad') bothBad++;
        }
        const leftIsA = rows[0].fingerprint_a === ma;
        const winsLeft = leftIsA ? counts.a : counts.b;
        const winsRight = leftIsA ? counts.b : counts.a;
        $('meta').innerHTML =
          '<span><b>Suite</b> #' + suiteId + '</span>' +
          '<span><b>Items judged</b> ' + rows.length + '</span>' +
          '<span><b>' + esc(ma) + ' wins</b> ' + winsLeft + '</span>' +
          '<span><b>' + esc(mb) + ' wins</b> ' + winsRight + '</span>' +
          '<span><b>Ties</b> ' + (counts.tie || 0) +
          (bothBad ? ' <span class="tie-tag">both bad ' + bothBad + '</span>' : '') + '</span>' +
          '<span><b>Judge</b> ' + esc(rows[0].judge_model) + '</span>';
        const box = $('items');
        box.innerHTML = '';
        let lastItem = null;
        for (const row of rows) {
          const base = row.item_id.split('#')[0];
          if (base !== lastItem) {
            lastItem = base;
            const [head, panel] = makeItemHead(base, defItems, suiteId);
            box.append(head, panel);
          }
          const sxs = document.createElement('div');
          sxs.className = 'sxs';
          // detail cards follow the same display order as the summary
          const firstSlot = row.fingerprint_a === ma ? 'a' : 'b';
          const secondSlot = firstSlot === 'a' ? 'b' : 'a';
          sxs.append(respCard(row, firstSlot), respCard(row, secondSlot));
          box.append(sxs, verdictCard(row));
        }
        $('status').textContent = rows.length + ' judgment row(s) — both presentation ' +
          'orders aggregate here (position swap; a third "tiebreak" row ' +
          'resolves decided splits, ADR 007).';
      } catch (err) {
        $('status').textContent = 'Failed to load judgments: ' + err;
      }
    }
    load();
  </script>
</body>
</html>
