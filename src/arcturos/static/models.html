<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcturos — Models</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 960px; color: #1a1a1a; background: #fafafa; }
    header { border-bottom: 2px solid #222; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: #666; margin-top: .25rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #e5e5e5;
             font-size: .9rem; }
    th { font-weight: 600; color: #444; }
    td.mono { font-family: ui-monospace, monospace; font-size: .82rem; word-break: break-all; }
    .status { color: #666; font-size: .85rem; margin-top: .75rem; }
    nav a { margin-right: 1rem; color: #1a1a1a; text-decoration: none; font-weight: 600; }
    nav a.active { text-decoration: underline; }
    .card { background: #fff; border: 1px solid #e5e5e5; padding: 1rem; margin-bottom: 1rem; }
    .card h3 { margin: 0 0 .5rem; font-size: 1.05rem; }
    .card .fp { font-family: ui-monospace, monospace; font-size: .8rem; color: #333;
                word-break: break-all; }
    .card .meta { color: #666; font-size: .85rem; margin-top: .5rem; }
    .card label { display: block; margin-top: .75rem; font-size: .85rem; font-weight: 600; }
    .card input { width: 60%; padding: .35rem; margin-top: .25rem; }
    .card button { margin-top: .5rem; padding: .3rem .8rem; }
    .msg { font-size: .85rem; margin-top: .25rem; }
    .msg.ok { color: #0a7f36; }
    .msg.err { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <h1>Arcturos</h1>
    <div class="sub">Local-first LLM benchmarking &amp; evaluation dashboard</div>
    <nav>
      <a href="/">Runs</a>
      <a href="/compare">Compare</a>
      <a href="/diff">Diff</a>
      <a href="/evals">Evals</a>
      <a href="/judgments">Judgments</a>
      <a href="/reports">Reports</a>
      <a href="/create">Create &amp; Run</a>
      <a href="/models">Models</a>
      <a href="/baselines">Baselines</a>
      <a href="/models" class="active">Models</a>
      <a href="/baselines">Baselines</a>
    </nav>
  </header>

  <h2>Model registry</h2>
  <p class="status" id="status">Loading…</p>
  <div id="cards"></div>

  <script>
    // The fingerprint is immutable and shown prominently (§4.6); the alias
    // is the only editable field. Compare/eval selectors resolve aliases.
    async function loadModels() {
      const status = document.getElementById('status');
      const wrap = document.getElementById('cards');
      try {
        const res = await fetch('/api/models');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const models = await res.json();
        wrap.textContent = '';
        if (!models.length) {
          status.textContent = 'No models registered yet — dispatch a bench or eval and the fingerprint lands here automatically.';
          return;
        }
        status.textContent = models.length + ' model(s) registered.';
        for (const m of models) {
          const card = document.createElement('div');
          card.className = 'card';
          const h = document.createElement('h3');
          h.textContent = m.alias || m.model_fingerprint_short;
          card.appendChild(h);
          const fp = document.createElement('div');
          fp.className = 'fp';
          fp.textContent = m.model_fingerprint;
          fp.title = 'immutable fingerprint';
          card.appendChild(fp);
          const meta = document.createElement('div');
          meta.className = 'meta';
          const parts = [
            'engine: ' + (m.engine || '—'),
            'runs: ' + m.run_count,
            'first seen: ' + (m.first_seen || '—'),
            'last seen: ' + (m.last_seen || '—')
          ];
          meta.textContent = parts.join(' · ');
          card.appendChild(meta);
          const lbl = document.createElement('label');
          lbl.textContent = 'Alias (label only — fingerprint stays immutable)';
          card.appendChild(lbl);
          const input = document.createElement('input');
          input.value = m.alias || '';
          input.placeholder = 'e.g. ds4-flash-250w';
          input.setAttribute('aria-label', 'Alias for ' + m.model_fingerprint);
          card.appendChild(input);
          const btn = document.createElement('button');
          btn.textContent = 'Save alias';
          card.appendChild(btn);
          const msg = document.createElement('div');
          msg.className = 'msg';
          card.appendChild(msg);
          btn.addEventListener('click', async () => {
            msg.className = 'msg';
            msg.textContent = '';
            try {
              const r = await fetch('/api/models/' + encodeURIComponent(m.model_fingerprint), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ alias: input.value })
              });
              if (!r.ok) {
                const detail = (await r.json()).detail;
                msg.className = 'msg err';
                msg.textContent = 'Save failed: ' + (typeof detail === 'string' ? detail : JSON.stringify(detail));
                return;
              }
              msg.className = 'msg ok';
              msg.textContent = 'Alias saved.';
              if (input.value) h.textContent = input.value;
              else h.textContent = m.model_fingerprint_short;
            } catch (err) {
              msg.className = 'msg err';
              msg.textContent = 'Save failed: ' + err;
            }
          });
          wrap.appendChild(card);
        }
      } catch (err) {
        status.textContent = 'Failed to load models: ' + err;
      }
    }
    loadModels();
  </script>
</body>
</html>
