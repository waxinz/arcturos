  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">

  <title>Arcturos — Models</title>

  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 960px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    table { border-collapse: collapse; width: 100%; background: var(--surface); }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border);
             font-size: .9rem; }
    th { font-weight: 600; color: var(--text-soft); }
    td.mono { font-family: ui-monospace, monospace; font-size: .82rem; word-break: break-all; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; }
    .card h3 { margin: 0 0 .5rem; font-size: 1.05rem; }
    .card .fp { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--fp-text);
                word-break: break-all; }
    .card .meta { color: var(--text-muted); font-size: .85rem; margin-top: .5rem; }
    .card label { display: block; margin-top: .75rem; font-size: .85rem; font-weight: 600; }
    .card input { width: 60%; padding: .35rem; margin-top: .25rem; }
    .card button { margin-top: .5rem; padding: .3rem .8rem; }
    .msg { font-size: .85rem; margin-top: .25rem; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="models" data-section="Settings">
  <aside class="sidebar">

      <span class="brand-text">
        <a class="brand" href="/">Arcturos</a>
        <span class="brand-sub">LLM benchmark &amp; eval dashboard</span>
      </span>
    </div>
    <nav>
      <div class="nav-section" data-nav-section="Benchmarks">
        <div class="nav-section-head">Benchmarks</div>
        <a href="/kickoff" data-page="kickoff"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg><span class="nav-label">Start</span></a>
        <a href="/compare" data-page="compare"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-5"/></svg><span class="nav-label">Compare</span></a>
      </div>
      <div class="nav-section" data-nav-section="Evals">
        <div class="nav-section-head">Evals</div>
        <a href="/evals/suites/new" data-page="evalsuite"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M12 8.5v7M8.5 12h7"/></svg><span class="nav-label">Create</span></a>
        <a href="/evals" data-page="evals"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 6H21M8.5 12H21M8.5 18H21"/><path d="M3.5 6h1M3.5 12h1M3.5 18h1"/></svg><span class="nav-label">Results</span></a>
        <a href="/judgments" data-page="judgments"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.4 6 .9-4.3 4.2 1 6L12 17.2l-5.4 2.8 1-6L3.3 9.8l6-.9z"/></svg><span class="nav-label">Judgments</span></a>

      </div>
      <div class="nav-section" data-nav-section="Settings">
        <div class="nav-section-head">Settings</div>
        <a href="/models" data-page="models"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></svg><span class="nav-label">Models</span></a>
        <a href="/baselines" data-page="baselines"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 4.75L12 13 3.5 8.25z"/><path d="M4.5 12.5l7.5 4.25 7.5-4.25"/><path d="M4.5 16.5l7.5 4.25 7.5-4.25"/></svg><span class="nav-label">Baselines</span></a>

    </nav>
    <div class="sidebar-foot">
      <button class="theme-toggle-inline" data-theme-toggle>☾</button>
    </div>
  </aside>

  <main class="page">
  <h2>Model registry</h2>
  <p class="status" id="status">Loading…</p>
  <div id="cards"></div>

  <script>
    // The fingerprint is immutable and shown prominently (§4.6); the alias
    // is the only editable field. Compare/eval selectors resolve aliases.
    async function loadModels() {
      const status = document.getElementById('status');
      const wrap = document.getElementById('cards');
      try {
        const res = await fetch('/api/models');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const models = await res.json();
        wrap.textContent = '';
        if (!models.length) {
          status.textContent = 'No models registered yet — dispatch a bench or eval and the fingerprint lands here automatically.';
          return;
        }
        status.textContent = models.length + ' model(s) registered.';
        for (const m of models) {
          const card = document.createElement('div');
          card.className = 'card';
          const h = document.createElement('h3');
          h.textContent = m.alias || m.model_fingerprint_short;
          card.appendChild(h);
          const fp = document.createElement('div');
          fp.className = 'fp';
          fp.textContent = m.model_fingerprint;
          fp.title = 'immutable fingerprint';
          card.appendChild(fp);
          const meta = document.createElement('div');
          meta.className = 'meta';
          const parts = [
            'engine: ' + (m.engine || '—'),
            'runs: ' + m.run_count,
            'first seen: ' + fmtLocalTime(m.first_seen),
            'last seen: ' + fmtLocalTime(m.last_seen)
          ];
          meta.textContent = parts.join(' · ');
          card.appendChild(meta);
          const lbl = document.createElement('label');
          lbl.textContent = 'Alias (label only — fingerprint stays immutable)';
          card.appendChild(lbl);
          const input = document.createElement('input');
          input.value = m.alias || '';
          input.placeholder = 'e.g. ds4-flash-250w';
          input.setAttribute('aria-label', 'Alias for ' + m.model_fingerprint);
          card.appendChild(input);
          const btn = document.createElement('button');
          btn.textContent = 'Save alias';
          card.appendChild(btn);
          const msg = document.createElement('div');
          msg.className = 'msg';
          card.appendChild(msg);
          btn.addEventListener('click', async () => {
            msg.className = 'msg';
            msg.textContent = '';
            try {
              const r = await fetch('/api/models/' + encodeURIComponent(m.model_fingerprint), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ alias: input.value })
              });
              if (!r.ok) {
                const detail = (await r.json()).detail;
                msg.className = 'msg err';
                msg.textContent = 'Save failed: ' + (typeof detail === 'string' ? detail : JSON.stringify(detail));
                return;
              }
              msg.className = 'msg ok';
              msg.textContent = 'Alias saved.';
              if (input.value) h.textContent = input.value;
              else h.textContent = m.model_fingerprint_short;
            } catch (err) {
              msg.className = 'msg err';
              msg.textContent = 'Save failed: ' + err;
            }
          });
          wrap.appendChild(card);
        }
      } catch (err) {
        status.textContent = 'Failed to load models: ' + err;
      }
    }
    loadModels();
  </script>
  </main>

</body>
</html>
