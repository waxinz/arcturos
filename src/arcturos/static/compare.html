<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos — Compare</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 1080px; color: #1a1a1a; background: #fafafa; }
    header { border-bottom: 2px solid #222; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: #666; margin-top: .25rem; }
    nav a { margin-right: 1rem; color: #1a1a1a; text-decoration: none; font-weight: 600; }
    nav a.active { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e5e5e5;
             font-size: .88rem; }
    th { font-weight: 600; color: #444; }
    td.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
    .controls { margin: 1rem 0; display: flex; gap: 2rem; flex-wrap: wrap; align-items: start; }
    .controls h3 { font-size: .95rem; margin: 0 0 .4rem; color: #444; }
    .metric-pick label { display: block; font-size: .85rem; margin: .15rem 0; }
    button { padding: .45rem .9rem; font-size: .9rem; cursor: pointer; }
    .chart-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px;
                  padding: .8rem; margin-bottom: 1.2rem; }
    .chart-card h3 { margin: 0 0 .5rem; font-size: 1rem; color: #222; }
    .chart-wrap { position: relative; height: 340px; }
    .status { color: #666; font-size: .85rem; margin-top: .75rem; }
    .empty { color: #666; padding: 2rem; text-align: center; }
    .hint { color: #767676; font-size: .82rem; margin-left: .4rem; }
    th.sel-h { width: 2rem; }
    code { background: #eee; padding: 0 .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Arcturos</h1>
    <div class="sub">Local-first LLM benchmarking &amp; evaluation dashboard</div>
        <nav>
      <a href="/create">Create &amp; Run</a>
      <a href="/">Runs</a>
      <a href="/compare" class="active">Compare</a>
      <a href="/diff">Diff</a>
      <a href="/evals">Evals</a>
      <a href="/judgments">Judgments</a>
      <a href="/reports">Reports</a>
      <a href="/models">Models</a>
      <a href="/baselines">Baselines</a>
    </nav>
  </header>

  <h2>Compare</h2>

  <div class="controls">
    <div>
      <h3>Runs (select ≥ 2)</h3>
      <div id="run-list"><span class="status">Loading runs…</span></div>
    </div>
    <div>
      <h3>Metrics</h3>
      <div class="metric-pick" id="metric-picks"></div>
    </div>
    <div style="align-self: flex-end;">
      <button id="compare-btn" disabled>Compare</button>
      <span class="hint" id="compare-hint">select ≥ 2 runs to enable</span>
      <div style="margin-top: .5rem;">
        <label for="baseline-select" style="font-size:.85rem; font-weight:600;">Baseline</label>
        <select id="baseline-select" style="display:block; margin-top:.25rem; max-width: 16rem;">
          <option value="">— none —</option>
        </select>
        <span class="hint">pinned reference: dashed line + deltas</span>
      </div>
      <button id="export-btn" style="margin-top:.5rem;" disabled>⤓ Export CSV</button>
    </div>
  </div>

  <div id="charts"></div>
  <div id="delta-tables"></div>
  <p id="status" class="status"></p>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script>
    const METRICS = [
      'decode_tps', 'prefill_tps', 'ttft_ms', 'wall_s',
      'output_tokens', 'mtp_acceptance', 'power_watts'
    ];
    const METRIC_LABELS = {
      decode_tps: 'decode tok/s', prefill_tps: 'prefill tok/s',
      ttft_ms: 'TTFT (ms)', wall_s: 'wall time (s)',
      output_tokens: 'output tokens', mtp_acceptance: 'MTP acceptance',
      power_watts: 'power (W)'
    };
    const PALETTE = ['#0b6bcb', '#e07b39', '#2fa36b', '#9b59b6', '#c0392b', '#16a085'];
    const charts = {};

    let ALIASES = {};
    async function loadAliases() {
      // Registry aliases (§4.6): the label the owner gave the fingerprint,
      // shown 'alias (short-fp)' in legends so two similar models stay
      // distinguishable. Failure is non-fatal — the registry page may be
      // newer than this view.
      try {
        const res = await fetch('/api/models');
        if (!res.ok) return;
        ALIASES = Object.fromEntries(
          (await res.json()).map(m => [m.model_fingerprint, m.alias]));
      } catch { /* leave empty */ }
    }

    let RUNS_INDEX = [];  // full run rows for the baseline-select builder

    async function loadRuns() {
      await loadAliases();
      const res = await fetch('/api/runs');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const runs = await res.json();
      RUNS_INDEX = runs;
      const box = document.getElementById('run-list');
      if (!runs.length) {
        box.innerHTML = '<p class="empty">No runs yet — run <code>arcturos bench &lt;endpoint&gt; --model M</code> first.</p>';
        return;
      }
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th class="sel-h"><span class="sr">select</span></th>' +
                        '<th>ID</th><th>Model (fingerprint)</th>' +
                        '<th>Engine</th><th>Context size</th><th>Created (UTC)</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const r of runs) {
        const tr = document.createElement('tr');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.dataset.runId = r.id;
        const td = document.createElement('td'); td.appendChild(cb); tr.appendChild(td);
        for (const [k, cls] of [['id','mono'], ['model_fingerprint','mono'],
                                ['engine',''], ['context_size',''], ['created_at','']]) {
          const cell = document.createElement('td');
          cell.textContent = r[k];
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        cb.addEventListener('change', () => {
          updateCompareBtn();
          rebuildBaselineSelect();
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      box.innerHTML = '';
      box.appendChild(table);
    }



    function buildMetricPicks() {
      const box = document.getElementById('metric-picks');
      for (const m of METRICS) {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = m;
        // Default to decode tok/s only: 7 stacked charts on load is chart
        // spam (UX review finding 6); the operator ticks more as needed.
        cb.checked = (m === 'decode_tps');
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + METRIC_LABELS[m]));
        box.appendChild(label);
      }
    }

    function shortName(fp) {
      // Mirrors the API: basename of a path fingerprint, shard suffix stripped.
      if (fp.includes('/')) {
        let name = fp.split('/').pop();
        if (name.endsWith('.gguf')) name = name.slice(0, -5);
        name = name.replace(/-\d+-of-\d+$/, '');
        return name;
      }
      return fp;
    }

    function destroyCharts() {
      for (const key in charts) { charts[key].destroy(); delete charts[key]; }
    }

    async function compare() {
      const status = document.getElementById('status');
      const box = document.getElementById('charts');
      const btn = document.getElementById('compare-btn');
      const runIds = Array.from(document.querySelectorAll('#run-list input[type=checkbox]:checked'))
        .map(cb => cb.dataset.runId).sort((a, b) => a - b);
      const metrics = Array.from(document.querySelectorAll('#metric-picks input:checked'))
        .map(cb => cb.value);
      if (runIds.length < 2) { status.textContent = 'Select at least two runs.'; return; }
      if (!metrics.length) { status.textContent = 'Select at least one metric.'; return; }
      // Busy-disable: double submits re-fetch and destroy charts mid-flight
      // (UX review finding 6).
      btn.disabled = true;
      const prevLabel = btn.textContent;
      btn.textContent = '⏳ Comparing…';
      destroyCharts();
      box.innerHTML = '';
      status.textContent = 'Loading…';
      try {
        const baselineSel = document.getElementById('baseline-select').value;
        let url = '/api/compare/benchmarks?runs=' + runIds.join(',') +
                  '&metrics=' + metrics.join(',');
        if (baselineSel) url += '&baseline=' + encodeURIComponent(baselineSel);
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const data = await res.json();
        box.innerHTML = '';
        document.getElementById('delta-tables').textContent = '';
        const runsById = {};
        for (const r of data.runs) runsById[r.id] = r;
        for (const metric of data.metrics) {
          const card = document.createElement('div');
          card.className = 'chart-card';
          card.innerHTML = '<h3>' + METRIC_LABELS[metric] + ' (' + metric + ')</h3>' +
                           '<div class="chart-wrap"><canvas></canvas></div>';
          box.appendChild(card);
          const canvas = card.querySelector('canvas');
          const datasets = data.runs.map((r, i) => ({
            label: legendName(r),
            data: (data.series[metric][r.id] || []).map(p =>
              ({ x: p.context_tokens, y: p.value })),
            borderColor: PALETTE[i % PALETTE.length],
            backgroundColor: PALETTE[i % PALETTE.length],
            pointRadius: 4, tension: 0
          }));
          // Dashed baseline overlay (§4.6): the pinned reference is a
          // separate dataset, visually distinct (dash + grey), and excluded
          // from the run legend colour wheel.
          if (data.series.baseline && data.series.baseline[metric]) {
            datasets.push({
              label: '📌 baseline: ' + data.baseline.model_fingerprint_short +
                     ' (run ' + data.baseline.run_id + ')',
              data: data.series.baseline[metric].map(p =>
                ({ x: p.context_tokens, y: p.value })),
              borderColor: '#555',
              backgroundColor: '#555',
              borderDash: [6, 4],
              pointRadius: 0,
              borderWidth: 2,
              tension: 0
            });
          }
          charts[metric] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { datasets: datasets },
            options: {
              responsive: true, maintainAspectRatio: false,
              spanGaps: false,
              scales: {
                x: { type: 'logarithmic', title: { display: true, text: 'context tokens' } },
                y: { beginAtZero: false, title: { display: true, text: METRIC_LABELS[metric] } }
              },
              plugins: { legend: { display: true, labels: { boxWidth: 12 } } }
            }
          });
        }
        status.textContent = runIds.length + ' run(s) × ' + metrics.length +
                             ' metric(s): ' + data.runs.map(r => legendName(r)).join(' vs ');
        if (data.baseline) {
          await renderDeltaTables(data, runIds);
          status.textContent += ' — vs 📌 baseline ' +
            data.baseline.model_fingerprint_short + ' (run ' +
            data.baseline.run_id + ')';
        }
        document.getElementById('export-btn').disabled = false;
      } catch (err) {
        status.textContent = 'Failed to compare: ' + err;
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    function legendName(r) {
      // Fingerprints over labels (principle 3) but readable: 'alias
      // (short-fp)' so two 'same' models stay distinguishable (UX review).
      const alias = ALIASES[r.model_fingerprint];
      return alias ? alias + ' (' + r.model_fingerprint_short + ')'
                   : r.model_fingerprint_short;
    }

    function fmtNum(v) {
      return (v === null || v === undefined) ? '—' : String(v);
    }

    async function renderDeltaTables(data, runIds) {
      // Per-run delta tables against the baseline (§4.6): one table per
      // run, one row per (metric, context point) where BOTH sides exist.
      // Signed percent + direction-aware good/bad colouring — the payload
      // is self-describing, so the view only formats numbers.
      const wrap = document.getElementById('delta-tables');
      wrap.innerHTML = '';
      const header = document.createElement('h3');
      header.textContent = 'Deltas vs 📌 baseline ' +
        data.baseline.model_fingerprint_short +
        ' (run ' + data.baseline.run_id + ')';
      wrap.appendChild(header);
      for (const run of data.runs) {
        let url = '/api/compare/baseline-deltas?runs=' + encodeURIComponent(runIds.join(',')) +
                  '&run=' + run.id +
                  '&metrics=' + data.metrics.join(',') +
                  '&baseline=' + data.baseline.run_id;
        const res = await fetch(url);
        if (!res.ok) {
          wrap.appendChild(document.createTextNode(
            'Deltas for run ' + run.id + ' unavailable (HTTP ' + res.status + ')'));
          continue;
        }
        const deltas = (await res.json())[String(run.id)] || {};
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const hrow = document.createElement('tr');
        for (const th of ['Run', 'Metric', 'ctx tokens', 'baseline', 'value',
                          'delta', 'delta %']) {
          const cell = document.createElement('th');
          cell.textContent = th;
          hrow.appendChild(cell);
        }
        thead.appendChild(hrow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        let any = false;
        for (const metric of data.metrics) {
          for (const row of (deltas[metric] || [])) {
            any = true;
            const tr = document.createElement('tr');
            const cells = [
              legendName(data.runs.find(r => r.id === run.id)),
              METRIC_LABELS[metric],
              row.context_tokens,
              fmtNum(row.baseline_value),
              fmtNum(row.value),
              fmtNum(row.delta),
              row.delta_pct === null ? '—' :
                ((row.delta_pct * 100).toFixed(1) + '%')
            ];
            for (let i = 0; i < cells.length; i++) {
              const td = document.createElement('td');
              td.textContent = cells[i];
              if (i === 0 || i === 2) td.className = 'mono';
              // direction-aware colour: METRIC_DIRECTIONS lives in the
              // payload-less view; reuse the diff view's semantics via a
              // local map (higher-is-better metrics)
              if (i === 6 && row.delta_pct !== null) {
                // power_watts stays uncolored: the API direction map marks
                // it neutral (informational), so the view must not verdict it.
                const higherBetter = ['decode_tps', 'prefill_tps',
                  'output_tokens', 'mtp_acceptance'];
                const good = higherBetter.includes(metric)
                  ? row.delta_pct > 0 : row.delta_pct < 0;
                td.style.color = good ? '#0a7f36' : '#b00020';
              }
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
        }
        if (!any) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 7;
          td.textContent = 'No overlapping context points with the baseline ' +
            '(both sides must have the metric at the same ctx length).';
          tr.appendChild(td);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        wrap.appendChild(table);
      }
    }

    function updateCompareBtn() {
      const n = document.querySelectorAll('#run-list input[type=checkbox]:checked').length;
      document.getElementById('compare-btn').disabled = n < 2;
      document.getElementById('compare-hint').textContent =
        n < 2 ? 'select ≥ 2 runs to enable' : 'ready';
      // Export follows the compare button: same ≥2-runs gate, no payload
      // exists before a compare ran, so the button is dead until then.
      document.getElementById('export-btn').disabled =
        n < 2 || !Object.keys(charts).length;
    }

    let PINNED = [];  // [{id, model_fingerprint, metric_family, run_id}]
    async function loadBaselines() {
      try {
        const res = await fetch('/api/baselines');
        if (!res.ok) return;
        PINNED = await res.json();
      } catch { /* non-fatal */ }
    }

    function rebuildBaselineSelect() {
      // Options: any pinned baseline whose fingerprint matches a selected
      // run, or any selected run itself (ad-hoc reference). The select
      // lists run ids — a baseline pin is per fingerprint, the run is the
      // concrete data.
      const sel = document.getElementById('baseline-select');
      const checked = [...document.querySelectorAll('#run-list input[type=checkbox]:checked')]
        .map(cb => parseInt(cb.dataset.runId, 10));
      const selRuns = RUNS_INDEX.filter(r => checked.includes(r.id));
      const pinnedForSelection = PINNED.filter(b =>
        selRuns.some(r => r.model_fingerprint === b.model_fingerprint));
      const prev = sel.value;
      sel.textContent = '';
      const none = document.createElement('option');
      none.value = ''; none.textContent = '— none —';
      sel.appendChild(none);
      for (const b of pinnedForSelection) {
        const o = document.createElement('option');
        o.value = String(b.run_id);
        const run = selRuns.find(r => r.id === b.run_id);
        const short = run ? run.model_fingerprint_short : b.model_fingerprint;
        o.textContent = '📌 pinned ' + b.metric_family + ' — ' + short + ' (run ' + b.run_id + ')';
        sel.appendChild(o);
      }
      for (const r of selRuns) {
        const o = document.createElement('option');
        o.value = String(r.id);
        o.textContent = 'ad-hoc: ' + shortName(r.model_fingerprint) + ' (run ' + r.id + ')';
        sel.appendChild(o);
      }
      if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
    }

    document.getElementById('compare-btn').addEventListener('click', compare);
    document.getElementById('export-btn').addEventListener('click', () => {
      // Re-fetch with format=csv: the browser honours the attachment
      // header, so the file lands in Downloads without JS plumbing.
      const runIds = [...document.querySelectorAll('#run-list input[type=checkbox]:checked')]
        .map(cb => cb.dataset.runId);
      const metrics = [...document.querySelectorAll('#metric-picks input:checked')]
        .map(cb => cb.value);
      const baselineSel = document.getElementById('baseline-select').value;
      let url = '/api/compare/benchmarks?runs=' + runIds.join(',') +
                '&metrics=' + metrics.join(',') + '&format=csv';
      if (baselineSel) url += '&baseline=' + encodeURIComponent(baselineSel);
      window.location = url;
    });
    buildMetricPicks();
    loadBaselines().then(rebuildBaselineSelect);
    loadRuns().then(rebuildBaselineSelect).catch(err => {
      document.getElementById('run-list').textContent = 'Failed to load runs: ' + err;
    });
  </script>
</body>
</html>
