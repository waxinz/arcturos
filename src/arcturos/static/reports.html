<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos — Reports</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 1080px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    h2 { font-size: 1.3rem; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .controls { margin: 1rem 0; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: end; }
    .controls label { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
    .controls select { margin-left: .4rem; padding: .3rem; font-size: .9rem; min-width: 280px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
            padding: .8rem; margin-bottom: 1.2rem; }
    .card h3 { margin: 0 0 .5rem; font-size: 1rem; color: var(--text-heading); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border);
             font-size: .88rem; vertical-align: top; }
    th { font-weight: 600; color: var(--text-soft); }
    td.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
    td.num { text-align: right; font-family: ui-monospace, monospace; font-size: .8rem; }
    .pct { color: var(--clock); }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
          padding: .8rem; overflow-x: auto; font-size: .8rem; line-height: 1.4; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .empty { color: var(--text-muted); padding: 2rem; text-align: center; }
    .big { font-size: 1.05rem; font-weight: 600; }
    /* v0.2: n < 20 rows tint low-confidence */
    td.lowconf { background: var(--bar-track); }
    tr:hover td.lowconf { filter: brightness(1.1); }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="reports" data-section="Evals">
  <!--NAV-->

  <main class="page">
  <h2>Reports</h2>

  <div class="controls">
    <label>Suite
      <select id="suite-select"><option value="">— choose a suite —</option></select>
    </label>
    <label>Judge generation
      <select id="gen-judge" style="min-width:200px;"><option value="">All judges</option></select>
    </label>
    <label>Template
      <select id="gen-template" style="min-width:200px;"><option value="">All templates</option></select>
    </label>
  </div>

  <div id="report"></div>
  <p id="status" class="status"></p>

  <script>
    async function loadSuites() {
      const res = await fetch('/api/eval-suites');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const suites = await res.json();
      const sel = document.getElementById('suite-select');
      sel.innerHTML = '<option value="">— choose a suite —</option>';
      for (const s of suites) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + ' ' + s.version + ' (#' + s.id + ')';
        sel.appendChild(opt);
      }
      if (suites.length === 1) {
        sel.value = suites[0].id;
        loadReport(suites[0].id);
      }
    }

    function pctCell(v) {
      return v === null || v === undefined ? '—' : v + '%';
    }

    // v0.2 statistical honesty: n < 20 renders low-confidence tinted.
    function lowN(total) { return total < 20; }

    function wilsonCell(w) {
      if (!w) return '—';
      return '[' + w.low + '%, ' + w.high + '%]';
    }

    function overallCard(report) {
      const o = report.overall;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Overall — ' + (o.total || 0) + ' judgment(s)</h3>';
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Winner</th><th class="num">Count</th>' +
        '<th class="num">Percent</th><th class="num">A-win 95% CI</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const side of ['a', 'b', 'tie']) {
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.textContent = side;
        const tdCount = document.createElement('td');
        tdCount.className = 'num';
        tdCount.textContent = o.counts[side];
        const tdPct = document.createElement('td');
        tdPct.className = 'num pct';
        tdPct.textContent = pctCell(o.percent[side]);
        tr.appendChild(tdName); tr.appendChild(tdCount); tr.appendChild(tdPct);
        if (side === 'a') {
          const tdW = document.createElement('td');
          tdW.className = 'num';
          tdW.textContent = wilsonCell(o.wilson_a);
          tr.appendChild(tdW);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    // v0.2 PRIMARY lens: "which model is better, on which axes".
    function dimensionCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>By dimension — the headline lens</h3>';
      const dims = Object.keys(report.by_dimension || {});
      if (!dims.length) {
        card.appendChild(empty('No judged items yet — dimensions come from the suite definition.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Dimension</th>' +
        '<th class="num">A wins</th><th class="num">B wins</th><th class="num">Ties</th>' +
        '<th class="num">n</th><th class="num">A%</th><th class="num">B%</th>' +
        '<th class="num">A-win 95% CI</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const dim of dims.sort()) {
        const c = report.by_dimension[dim];
        const tr = document.createElement('tr');
        if (lowN(c.total)) tr.title = 'n < 20 — low confidence';
        const cells = [
          ['td', dim + (lowN(c.total) ? ' *' : ''), ''],
          ['td', c.counts.a, 'num'], ['td', c.counts.b, 'num'],
          ['td', c.counts.tie, 'num'], ['td', c.total, 'num'],
          ['td', pctCell(c.percent.a), 'num pct'],
          ['td', pctCell(c.percent.b), 'num pct'],
          ['td', wilsonCell(c.wilson_a), 'num'],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        if (lowN(c.total)) {
          for (const td of tr.cells) td.classList.add('lowconf');
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      const note = document.createElement('p');
      note.className = 'status';
      note.textContent = '* n < 20 — tinted rows are low-confidence.';
      card.appendChild(note);
      return card;
    }

    // v0.2: deterministic reference pass-rates (no judge needed).
    function referenceCard(report) {
      const ref = report.reference_scores;
      if (!ref || !ref.models || !Object.keys(ref.models).length) return null;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Reference checks — deterministic pass rates</h3>';
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Model</th><th class="num">Passed</th>' +
        '<th class="num">Failed</th><th class="num">n</th><th class="num">Pass %</th>' +
        '<th class="num">95% CI</th><th>Per dimension</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const fp of Object.keys(ref.models).sort()) {
        const m = ref.models[fp];
        const tr = document.createElement('tr');
        const perDim = Object.entries(m.by_dimension || {})
          .map(([d, v]) => d + ' ' + v.passed + '/' + v.total).join(', ') || '—';
        const cells = [
          ['td', fp, 'mono'],
          ['td', m.overall.passed, 'num'], ['td', m.overall.failed, 'num'],
          ['td', m.overall.total, 'num'],
          ['td', pctCell(m.overall.pass_pct), 'num pct'],
          ['td', wilsonCell(m.overall.wilson), 'num'],
          ['td', perDim, ''],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      const note = document.createElement('p');
      note.className = 'status';
      note.textContent = ref.reference_items + ' reference item(s), scored at report time' +
        ' from the newest suite definition snapshot — no judge involved.';
      card.appendChild(note);
      return card;
    }

    function pairsCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Pairs — win rates</h3>';
      if (!report.pairs.length) {
        card.appendChild(empty('No judged pairs yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Model A</th><th>Model B</th>' +
        '<th class="num">A wins</th><th class="num">B wins</th><th class="num">Ties</th>' +
        '<th class="num">n</th><th class="num">A%</th><th class="num">B%</th><th class="num">Tie%</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const p of report.pairs) {
        const tr = document.createElement('tr');
        const cells = [
          ['td', p.model_a, 'mono'], ['td', p.model_b, 'mono'],
          ['td', p.counts.a, 'num'], ['td', p.counts.b, 'num'],
          ['td', p.counts.tie, 'num'], ['td', p.total, 'num'],
          ['td', pctCell(p.percent.a), 'num pct'],
          ['td', pctCell(p.percent.b), 'num pct'],
          ['td', pctCell(p.percent.tie), 'num pct'],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function categoryCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>By category</h3>';
      const cats = Object.keys(report.by_category);
      if (!cats.length) {
        card.appendChild(empty('No category breakdown yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Category</th><th class="num">A</th>' +
        '<th class="num">B</th><th class="num">Tie</th><th class="num">Total</th>' +
        '<th class="num">A%</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const cat of cats) {
        const c = report.by_category[cat];
        const tr = document.createElement('tr');
        const cells = [
          ['td', cat, ''], ['td', c.counts.a, 'num'], ['td', c.counts.b, 'num'],
          ['td', c.counts.tie, 'num'], ['td', c.total, 'num'],
          ['td', pctCell(c.percent ? c.percent.a : null), 'num pct'],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function itemLevelCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Item drill-down</h3>';
      if (!report.item_level.length) {
        card.appendChild(empty('No item-level judgments yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Item</th><th>Winner</th><th>Model A</th><th>Model B</th>' +
        '<th>Judge</th><th>Template</th><th class="num">Confidence</th><th>Rationale</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const it of report.item_level) {
        const tr = document.createElement('tr');
        const cells = [
          ['td', it.item_id, 'mono'], ['td', it.winner, ''],
          ['td', it.model_a, 'mono'], ['td', it.model_b, 'mono'],
          ['td', it.judge_model, 'mono'], ['td', it.template, 'mono'],
          ['td', it.confidence === null || it.confidence === undefined ? '—' : it.confidence, 'num'],
          ['td', it.rationale || '—', ''],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function csvCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>CSV export</h3>';
      const pre = document.createElement('pre');
      pre.textContent = report.csv || '—';
      card.appendChild(pre);
      return card;
    }

    function empty(text) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = text;
      return p;
    }

    async function loadReport(suiteId) {
      const box = document.getElementById('report');
      const status = document.getElementById('status');
      box.innerHTML = '';
      status.textContent = 'Loading…';
      try {
        // Judge-generation scoping (v0.2): empty selects aggregate ALL.
        const jm = document.getElementById('gen-judge').value;
        const jt = document.getElementById('gen-template').value;
        const qs = new URLSearchParams();
        if (jm) qs.set('judge_model', jm);
        if (jt) qs.set('judge_template', jt);
        const q = qs.toString() ? '?' + qs.toString() : '';
        const res = await fetch('/api/reports/suite/' + suiteId + q);
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const data = await res.json();
        const report = data.report;
        populateGenerationFilter(report);
        box.appendChild(overallCard(report));
        box.appendChild(dimensionCard(report));
        box.appendChild(pairsCard(report));
        const refCard = referenceCard(report);
        if (refCard) box.appendChild(refCard);
        box.appendChild(categoryCard(report));
        box.appendChild(itemLevelCard(report));
        box.appendChild(csvCard(data));
        status.textContent = 'Suite #' + suiteId + ' — ' + report.suite.name +
          ' ' + report.suite.version + ' · ' + report.prompts + ' prompt(s), ' +
          report.results_stored + ' result(s), ' + report.judgments_stored +
          ' judgment(s)' + (jm || jt ? ' (scoped to one judge generation)' : '') + '.';
      } catch (err) {
        status.textContent = 'Failed to load report: ' + err;
      }
    }

    // Generation filter options come from the UNFILTERED generations list
    // (the backend reports all generations pre-filter); current selection
    // survives repopulation.
    function populateGenerationFilter(report) {
      if (!report.generations) return;
      const jm = document.getElementById('gen-judge');
      const jt = document.getElementById('gen-template');
      const judges = [...new Set(report.generations.map(g => g.judge_model))];
      const templates = [...new Set(report.generations.map(g => g.template))];
      for (const [sel, values, label] of [[jm, judges, 'All judges'],
                                          [jt, templates, 'All templates']]) {
        const current = sel.value;
        sel.innerHTML = '<option value="">' + label + '</option>';
        for (const v of values) {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = v;
          sel.appendChild(opt);
        }
        if ([...sel.options].some(o => o.value === current)) sel.value = current;
      }
    }

    document.getElementById('suite-select').addEventListener('change', () => {
      const suiteId = document.getElementById('suite-select').value;
      if (suiteId) loadReport(suiteId);
    });
    document.getElementById('gen-judge').addEventListener('change', () => {
      const suiteId = document.getElementById('suite-select').value;
      if (suiteId) loadReport(suiteId);
    });
    document.getElementById('gen-template').addEventListener('change', () => {
      const suiteId = document.getElementById('suite-select').value;
      if (suiteId) loadReport(suiteId);
    });

    loadSuites().catch(err => {
      document.getElementById('status').textContent = 'Failed to load suites: ' + err;
    });
  </script>
  </main>

</body>
</html>
