<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos — Reports</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 1080px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    h2 { font-size: 1.3rem; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .controls { margin: 1rem 0; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: end; }
    .controls label { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
    .controls select { margin-left: .4rem; padding: .3rem; font-size: .9rem; min-width: 280px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
            padding: .8rem; margin-bottom: 1.2rem; }
    .card h3 { margin: 0 0 .5rem; font-size: 1rem; color: var(--text-heading); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border);
             font-size: .88rem; vertical-align: top; }
    th { font-weight: 600; color: var(--text-soft); }
    td.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
    td.num { text-align: right; font-family: ui-monospace, monospace; font-size: .8rem; }
    .pct { color: var(--clock); }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
          padding: .8rem; overflow-x: auto; font-size: .8rem; line-height: 1.4; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .empty { color: var(--text-muted); padding: 2rem; text-align: center; }
    .big { font-size: 1.05rem; font-weight: 600; }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="reports" data-section="Evals">
  <aside class="sidebar">
    <div class="brand-row">
      <span class="brand-tile" aria-hidden="true">A</span>
      <span class="brand-text">
        <a class="brand" href="/">Arcturos</a>
        <span class="brand-sub">LLM benchmark &amp; eval dashboard</span>
      </span>
    </div>
    <nav>
      <div class="nav-section" data-nav-section="Benchmarks">
        <div class="nav-section-head">Benchmarks</div>
        <a href="/kickoff" data-page="kickoff"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg><span class="nav-label">Start</span></a>
        <a href="/compare" data-page="compare"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-5"/></svg><span class="nav-label">Compare</span></a>
      </div>
      <div class="nav-section" data-nav-section="Evals">
        <div class="nav-section-head">Evals</div>
        <a href="/evals/suites/new" data-page="evalsuite"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M12 8.5v7M8.5 12h7"/></svg><span class="nav-label">Create</span></a>
        <a href="/evals" data-page="evals"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 6H21M8.5 12H21M8.5 18H21"/><path d="M3.5 6h1M3.5 12h1M3.5 18h1"/></svg><span class="nav-label">Results</span></a>
        <a href="/judgments" data-page="judgments"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.4 6 .9-4.3 4.2 1 6L12 17.2l-5.4 2.8 1-6L3.3 9.8l6-.9z"/></svg><span class="nav-label">Judgments</span></a>
        <a href="/reports" data-page="reports"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5H7a2 2 0 00-2 2v13a2 2 0 002 2h10a2 2 0 002-2V8.5z"/><path d="M14 3.5v5h5M9.5 13h5M9.5 16.5h5"/></svg><span class="nav-label">Reports</span></a>
      </div>
      <div class="nav-section" data-nav-section="Settings">
        <div class="nav-section-head">Settings</div>
        <a href="/models" data-page="models"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></svg><span class="nav-label">Models</span></a>
        <a href="/baselines" data-page="baselines"><svg class="nav-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 4.75L12 13 3.5 8.25z"/><path d="M4.5 12.5l7.5 4.25 7.5-4.25"/><path d="M4.5 16.5l7.5 4.25 7.5-4.25"/></svg><span class="nav-label">Baselines</span></a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-toggle-inline" data-theme-toggle>☾</button>
    </div>
  </aside>

  <main class="page">
  <h2>Reports</h2>

  <div class="controls">
    <label>Suite
      <select id="suite-select"><option value="">— choose a suite —</option></select>
    </label>
  </div>

  <div id="report"></div>
  <p id="status" class="status"></p>

  <script>
    async function loadSuites() {
      const res = await fetch('/api/eval-suites');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const suites = await res.json();
      const sel = document.getElementById('suite-select');
      sel.innerHTML = '<option value="">— choose a suite —</option>';
      for (const s of suites) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + ' ' + s.version + ' (#' + s.id + ')';
        sel.appendChild(opt);
      }
      if (suites.length === 1) {
        sel.value = suites[0].id;
        loadReport(suites[0].id);
      }
    }

    function pctCell(v) {
      return v === null || v === undefined ? '—' : v + '%';
    }

    function overallCard(report) {
      const o = report.overall;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Overall — ' + (o.total || 0) + ' judgment(s)</h3>';
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Winner</th><th class="num">Count</th><th class="num">Percent</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const side of ['a', 'b', 'tie']) {
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.textContent = side;
        const tdCount = document.createElement('td');
        tdCount.className = 'num';
        tdCount.textContent = o.counts[side];
        const tdPct = document.createElement('td');
        tdPct.className = 'num pct';
        tdPct.textContent = pctCell(o.percent[side]);
        tr.appendChild(tdName); tr.appendChild(tdCount); tr.appendChild(tdPct);
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function pairsCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Pairs — win rates</h3>';
      if (!report.pairs.length) {
        card.appendChild(empty('No judged pairs yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Model A</th><th>Model B</th>' +
        '<th class="num">A wins</th><th class="num">B wins</th><th class="num">Ties</th>' +
        '<th class="num">n</th><th class="num">A%</th><th class="num">B%</th><th class="num">Tie%</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const p of report.pairs) {
        const tr = document.createElement('tr');
        const cells = [
          ['td', p.model_a, 'mono'], ['td', p.model_b, 'mono'],
          ['td', p.counts.a, 'num'], ['td', p.counts.b, 'num'],
          ['td', p.counts.tie, 'num'], ['td', p.total, 'num'],
          ['td', pctCell(p.percent.a), 'num pct'],
          ['td', pctCell(p.percent.b), 'num pct'],
          ['td', pctCell(p.percent.tie), 'num pct'],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function categoryCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>By category</h3>';
      const cats = Object.keys(report.by_category);
      if (!cats.length) {
        card.appendChild(empty('No category breakdown yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Category</th><th class="num">A</th>' +
        '<th class="num">B</th><th class="num">Tie</th><th class="num">Total</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const cat of cats) {
        const c = report.by_category[cat];
        const tr = document.createElement('tr');
        const cells = [
          ['td', cat, ''], ['td', c.a, 'num'], ['td', c.b, 'num'],
          ['td', c.tie, 'num'], ['td', c.total, 'num'],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function itemLevelCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>Item drill-down</h3>';
      if (!report.item_level.length) {
        card.appendChild(empty('No item-level judgments yet.'));
        return card;
      }
      const t = document.createElement('table');
      t.innerHTML = '<thead><tr><th>Item</th><th>Winner</th><th>Model A</th><th>Model B</th>' +
        '<th>Judge</th><th>Template</th><th class="num">Confidence</th><th>Rationale</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const it of report.item_level) {
        const tr = document.createElement('tr');
        const cells = [
          ['td', it.item_id, 'mono'], ['td', it.winner, ''],
          ['td', it.model_a, 'mono'], ['td', it.model_b, 'mono'],
          ['td', it.judge_model, 'mono'], ['td', it.template, 'mono'],
          ['td', it.confidence === null || it.confidence === undefined ? '—' : it.confidence, 'num'],
          ['td', it.rationale || '—', ''],
        ];
        for (const [tag, text, cls] of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      card.appendChild(t);
      return card;
    }

    function csvCard(report) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>CSV export</h3>';
      const pre = document.createElement('pre');
      pre.textContent = report.csv || '—';
      card.appendChild(pre);
      return card;
    }

    function empty(text) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = text;
      return p;
    }

    async function loadReport(suiteId) {
      const box = document.getElementById('report');
      const status = document.getElementById('status');
      box.innerHTML = '';
      status.textContent = 'Loading…';
      try {
        const res = await fetch('/api/reports/suite/' + suiteId);
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
        const data = await res.json();
        const report = data.report;
        box.appendChild(overallCard(report));
        box.appendChild(pairsCard(report));
        box.appendChild(categoryCard(report));
        box.appendChild(itemLevelCard(report));
        box.appendChild(csvCard(data));
        status.textContent = 'Suite #' + suiteId + ' — ' + report.suite.name +
          ' ' + report.suite.version + ' · ' + report.prompts + ' prompt(s), ' +
          report.results_stored + ' result(s), ' + report.judgments_stored + ' judgment(s).';
      } catch (err) {
        status.textContent = 'Failed to load report: ' + err;
      }
    }

    document.getElementById('suite-select').addEventListener('change', () => {
      const suiteId = document.getElementById('suite-select').value;
      if (suiteId) loadReport(suiteId);
    });

    loadSuites().catch(err => {
      document.getElementById('status').textContent = 'Failed to load suites: ' + err;
    });
  </script>
  </main>

</body>
</html>
