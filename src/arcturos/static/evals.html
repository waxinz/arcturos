<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/scorpio-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/scorpio-favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/static/icons/scorpio-favicon-180.png">
  <title>Arcturos — Evals</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nav.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto;
           max-width: 1080px; color: var(--text); background: var(--bg); }
    header { border-bottom: 2px solid var(--text-heading); padding-bottom: .5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    h2 { font-size: 1.3rem; }
    .sub { color: var(--text-muted); margin-top: .25rem; }
    nav a { margin-right: 1rem; color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:visited { color: var(--text); }
    nav a.active { text-decoration: underline; }
    .controls { margin: 1rem 0; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: end; }
    .controls label { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
    .controls select, .controls input { margin-left: .4rem; padding: .3rem; font-size: .9rem; }
    .controls input { min-width: 220px; }
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
                 padding: .8rem; margin-bottom: 1.2rem; }
    .item-card h3 { margin: 0 0 .5rem; font-size: 1rem; color: var(--text-heading); }
    .item-card h3 .meta { color: var(--hint); font-weight: 400; font-size: .82rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border);
             font-size: .88rem; vertical-align: top; }
    th { font-weight: 600; color: var(--text-soft); }
    td.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
    td.num { text-align: right; font-family: ui-monospace, monospace; font-size: .8rem; }
    .out { max-width: 360px; word-break: break-word; }
    .status { color: var(--text-muted); font-size: .85rem; margin-top: .75rem; }
    .empty { color: var(--text-muted); padding: 2rem; text-align: center; }
    a.jump { font-size: .82rem; white-space: nowrap; }
    /* ---- runs table (2026-10-15) ------------------------------------ */
    .runs-head h3, .explorer-head { margin: 1.4rem 0 .3rem; }
    .runs-head .hint { color: var(--text-muted); font-size: .85rem;
                       margin: 0 0 .6rem; }
    .table-scroll { overflow-x: auto; }   /* narrow screens: scroll, not wrap */
    #runs-table { background: var(--surface); border: 1px solid var(--border);
                  border-radius: 6px; }
    #runs-table th, #runs-table td { white-space: nowrap; }
    #runs-table td.out-cell { white-space: normal; }
    .run-actions { display: flex; flex-wrap: wrap; gap: .9rem;
                   align-items: center; margin: .6rem 0 0; }
    .run-actions .judge-model-label { font-size: .85rem; font-weight: 600;
                                      color: var(--text-soft); }
    .run-actions input { padding: .32rem .45rem; font-size: .88rem;
                         border: 1px solid var(--input-border); border-radius: 4px;
                         background: var(--bg); color: var(--text); }
    .run-actions button { padding: .38rem .9rem; font-size: .88rem; }
    /* judge-not-contestant guard: WARNING with override, not a dead end */
    .warn-card { display: flex; flex-wrap: wrap; align-items: center;
                 gap: .7rem; margin-top: .6rem; padding: .55rem .8rem;
                 border: 1px solid #b58a2a; border-radius: 6px;
                 background: rgba(181, 138, 42, .12); font-size: .86rem; }
    .warn-card[hidden] { display: none; }
    .warn-card button { padding: .3rem .7rem; font-size: .82rem; }
    #jpair-link { font-size: .88rem; }
  </style>
  <script src="/static/app-time.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nav.js"></script>
</head>
<body class="shell" data-page="evals" data-section="Evals">
  <!--NAV-->

  <main class="page">
  <h2>Evals <button id="export-evals" title="Download all eval results as CSV">⤓ CSV</button></h2>

  <div class="runs-head">
    <h3>Runs</h3>
    <p class="hint">Pick two runs of the same suite (different models), then
      “Judgements” judges them against each other. Click a run id for its
      stored rows.</p>
  </div>
  <div class="table-scroll">
    <table id="runs-table">
      <thead><tr>
        <th></th><th>Run</th><th>Suite</th><th>Model</th><th>Status</th>
        <th>Results</th><th>Created</th>
      </tr></thead>
      <tbody id="runs-body"><tr><td colspan="7" class="status">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="run-actions">
    <label class="judge-model-label">Judge model
      <input id="judge-model" placeholder="optional — blank = config default">
    </label>
    <button id="judge-btn" disabled>Judgements</button>
    <a id="jpair-link" hidden></a>
  </div>
  <div id="judge-warn" class="warn-card" hidden>
    <span id="judge-warn-text"></span>
    <button id="judge-warn-go">Judge anyway (override guard)</button>
  </div>
  <p id="run-status" class="status"></p>

  <h3 class="explorer-head">Results explorer</h3>
  <div class="controls">
    <label>Suite
      <select id="suite-select"><option value="">— choose a suite —</option></select>
    </label>
    <label>Model
      <select id="model-filter"><option value="">All models</option></select>
    </label>
    <label>Item
      <input id="item-filter" placeholder="filter by item id (e.g. sr-101)">
    </label>
  </div>

  <div id="results"></div>
  <p id="status" class="status"></p>

  <script>
    let suites = [];
    let results = [];

    function preview(s, n) {
      if (!s) return '(empty)';
      s = s.replace(/\s+/g, ' ').trim();
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    function baseId(itemId) {
      // multi-turn turn records share a base id: sr-101, sr-101#t2 -> sr-101
      return itemId.split('#')[0];
    }

    function turnLabel(itemId) {
      const m = itemId.match(/#t(\d+)$/);
      return m ? 't' + m[1] : '—';
    }

    async function loadSuites() {
      const res = await fetch('/api/eval-suites');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      suites = await res.json();
      const sel = document.getElementById('suite-select');
      sel.innerHTML = '<option value="">— choose a suite —</option>';
      for (const s of suites) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + ' ' + s.version + ' (#' + s.id + ')';
        sel.appendChild(opt);
      }
    }

    async function loadResults(suiteId) {
      const res = await fetch('/api/eval-suites/' + suiteId + '/results');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      results = await res.json();
      // populate model filter from the actual data
      const models = [...new Set(results.map(r => r.model_fingerprint))].sort();
      const mf = document.getElementById('model-filter');
      mf.innerHTML = '<option value="">All models</option>';
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        mf.appendChild(opt);
      }
    }

    function render() {
      const box = document.getElementById('results');
      const status = document.getElementById('status');
      const modelFilter = document.getElementById('model-filter').value;
      const itemFilter = document.getElementById('item-filter').value.trim().toLowerCase();
      box.innerHTML = '';
      if (!results.length) {
        status.textContent = 'No results for this suite yet.';
        return;
      }
      // results arrive ORDER BY id; group by base item id preserving first-seen
      // order, and keep every group's rows sorted by id (multi-turn turn rows
      // therefore appear in replay order).
      const groups = new Map();
      for (const r of results) {
        if (modelFilter && r.model_fingerprint !== modelFilter) continue;
        if (itemFilter && !r.item_id.toLowerCase().includes(itemFilter)) continue;
        const key = baseId(r.item_id);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      if (!groups.size) {
        status.textContent = 'No results match the current filters.';
        return;
      }
      for (const [itemId, rows] of groups) {
        const card = document.createElement('div');
        card.className = 'item-card';
        const turnCount = rows.filter(r => r.item_id.includes('#')).length;
        card.innerHTML = '<h3>' + itemId +
          ' <span class="meta">' + rows.length + ' result' + (rows.length === 1 ? '' : 's') +
          (turnCount ? ' · ' + turnCount + ' multi-turn turn' + (turnCount === 1 ? '' : 's') : '') +
          '</span></h3>';
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr>' +
          '<th>ID</th><th>Turn</th><th>Model fingerprint</th><th>Output</th>' +
          '<th class="num">prompt_tokens</th><th class="num">completion_tokens</th>' +
          '<th class="num">latency_ms</th><th></th></tr></thead>';
        const tbody = document.createElement('tbody');
        for (const r of rows) {
          const tr = document.createElement('tr');
          const full = r.output || '';
          const cells = [
            ['td', r.id, 'mono'],
            ['td', turnLabel(r.item_id), ''],
            ['td', r.model_fingerprint, 'mono'],
            ['td', preview(full, 120), 'out'],
            ['td', r.prompt_tokens, 'num'],
            ['td', r.completion_tokens, 'num'],
            ['td', r.latency_ms == null ? '—' : Math.round(r.latency_ms), 'num'],
          ];
          for (const [tag, text, cls] of cells) {
            const cell = document.createElement(tag);
            cell.textContent = text;
            if (cls) cell.className = cls;
            tr.appendChild(cell);
          }
          const outTd = tr.querySelector('td.out');
          // Drill-down: click toggles the full output inline (honest full
          // text, no truncation) per ux-design journey drill-down spec.
          // Keyboard parity (deferred UX review note): the cell is a
          // button-like target — Space/Enter toggles, it is focusable via
          // Tab, and Enter on a collapsed row expands without scrolling
          // the page (preventDefault on Space avoids the scroll jump).
          outTd.tabIndex = 0;
          outTd.setAttribute('role', 'button');
          outTd.setAttribute('aria-expanded', 'false');
          outTd.title = 'Click or press Enter/Space to expand full output';
          outTd.style.cursor = 'pointer';
          const toggle = () => {
            expanded = !expanded;
            if (expanded) {
              outTd.textContent = full;
              outTd.style.whiteSpace = 'pre-wrap';
              outTd.style.maxWidth = 'none';
              outTd.title = 'Click or press Enter/Space to collapse';
              outTd.setAttribute('aria-expanded', 'true');
            } else {
              outTd.textContent = preview(full, 120);
              outTd.style.whiteSpace = '';
              outTd.style.maxWidth = '';
              outTd.title = 'Click or press Enter/Space to expand full output';
              outTd.setAttribute('aria-expanded', 'false');
            }
          };
          let expanded = false;
          outTd.addEventListener('click', toggle);
          outTd.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') {
              ev.preventDefault();
              toggle();
            }
          });
          const linkTd = document.createElement('td');
          const link = document.createElement('a');
          link.href = '/judgments?result=' + r.id;
          link.textContent = 'judgments';
          link.className = 'jump';
          linkTd.appendChild(link);
          tr.appendChild(linkTd);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        card.appendChild(table);
        box.appendChild(card);
      }
      const shown = [...groups.values()].reduce((n, g) => n + g.length, 0);
      status.textContent = shown + ' result(s) across ' + groups.size + ' item(s).';
    }

    document.getElementById('suite-select').addEventListener('change', async () => {
      const status = document.getElementById('status');
      const suiteId = document.getElementById('suite-select').value;
      if (!suiteId) { document.getElementById('results').innerHTML = ''; status.textContent = ''; return; }
      status.textContent = 'Loading…';
      try {
        await loadResults(suiteId);
        render();
      } catch (err) {
        status.textContent = 'Failed to load results: ' + err;
      }
    });
    document.getElementById('model-filter').addEventListener('change', render);
    document.getElementById('item-filter').addEventListener('input', render);

    document.getElementById('export-evals').addEventListener('click', () => {
      window.location = '/api/export/eval-results';
    });

    // ---- runs table: multi-select → run-scoped judging ------------------
    let selectedRuns = [];

    async function loadRuns() {
      const tbody = document.getElementById('runs-body');
      const st = document.getElementById('run-status');
      try {
        const res = await fetch('/api/eval-runs');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const runs = await res.json();
        tbody.innerHTML = '';
        if (!runs.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="status">No replay runs yet — start one on the Run page.</td></tr>';
          return;
        }
        for (const r of runs) {
          const tr = document.createElement('tr');
          const tdCk = document.createElement('td');
          const ck = document.createElement('input');
          ck.type = 'checkbox';
          ck.dataset.runId = r.id;
          ck.dataset.suiteId = r.suite_id;
          ck.dataset.model = r.model_fingerprint;
          ck.setAttribute('aria-label', 'Select run ' + r.id);
          ck.addEventListener('change', onSelectionChange);
          tdCk.appendChild(ck);
          const tdId = document.createElement('td');
          const a = document.createElement('a');
          a.href = '/evals/runs/' + r.id;
          a.textContent = '#' + r.id;
          tdId.appendChild(a);
          const tdSuite = document.createElement('td');
          tdSuite.textContent = r.suite_name + ' ' + r.suite_version;
          const tdModel = document.createElement('td');
          tdModel.className = 'mono';
          tdModel.textContent = r.model_fingerprint;
          const tdStatus = document.createElement('td');
          tdStatus.textContent = r.status;
          if (r.status !== 'complete') tdStatus.style.color = 'var(--warn, #d80)';
          const tdCount = document.createElement('td');
          tdCount.className = 'num';
          tdCount.textContent = r.result_count;
          const tdCreated = document.createElement('td');
          tdCreated.textContent = window.fmtLocalTime(r.created_at);
          tr.append(tdCk, tdId, tdSuite, tdModel, tdStatus, tdCount, tdCreated);
          tbody.appendChild(tr);
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="status">Failed to load runs: ' + err + '</td></tr>';
      }
    }

    async function onSelectionChange() {
      const checked = [...document.querySelectorAll('#runs-body input[type=checkbox]:checked')];
      selectedRuns = checked.map(c => ({
        id: parseInt(c.dataset.runId, 10),
        suiteId: parseInt(c.dataset.suiteId, 10),
        model: c.dataset.model,
      }));
      const btn = document.getElementById('judge-btn');
      const link = document.getElementById('jpair-link');
      const st = document.getElementById('run-status');
      document.getElementById('judge-warn').hidden = true;
      link.hidden = true;
      if (selectedRuns.length !== 2) {
        btn.disabled = true;
        st.textContent = selectedRuns.length < 2
          ? 'Select two runs to judge them against each other.'
          : 'Exactly two runs at a time.';
        return;
      }
      const [x, y] = selectedRuns;
      if (x.suiteId !== y.suiteId) {
        btn.disabled = true;
        st.textContent = 'The two runs must share one suite.';
        return;
      }
      if (x.model === y.model) {
        btn.disabled = true;
        st.textContent = 'The two runs must be different models.';
        return;
      }
      btn.disabled = false;
      st.textContent = '';
      // Judgment available for this pair? → surface the SxS link.
      try {
        const res = await fetch('/api/judgments/pair?suite_id=' + x.suiteId +
                                '&model_a=' + encodeURIComponent(x.model) +
                                '&model_b=' + encodeURIComponent(y.model));
        if (res.ok) {
          const rows = await res.json();
          if (rows.length) {
            link.href = '/judgments/pair?suite_id=' + x.suiteId +
                        '&model_a=' + encodeURIComponent(x.model) +
                        '&model_b=' + encodeURIComponent(y.model);
            link.textContent = 'View judgment details (' + rows.length + ' rows) →';
            link.hidden = false;
          }
        }
      } catch (err) { /* link stays hidden — honest */ }
    }

    async function dispatchJudge(extra = {}) {
      const btn = document.getElementById('judge-btn');
      const st = document.getElementById('run-status');
      const warn = document.getElementById('judge-warn');
      const [x, y] = selectedRuns;
      const jm = document.getElementById('judge-model').value.trim();
      const body = {
        suite_id: x.suiteId,
        eval_run_ids: [x.id, y.id],
        ...extra,
      };
      if (jm) body.judge_model = jm;
      btn.disabled = true;
      warn.hidden = true;
      st.textContent = 'Starting judge job…';
      try {
        const res = await fetch('/api/ops/judge/jobs', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const d = typeof data.detail === 'string'
            ? data.detail : JSON.stringify(data.detail);
          if (d.includes('allow_contestant_judge')) {
            // Judge-not-contestant guard: a WARNING with an explicit
            // override — not a dead-end error. The operator decides the
            // family-bias risk is acceptable by clicking the button.
            document.getElementById('judge-warn-text').textContent =
              '⚠ ' + d;
            warn.hidden = false;
            st.textContent = '';
          } else {
            st.textContent = 'Failed: ' + d;
          }
          btn.disabled = false;
          return;
        }
        st.textContent = 'Judge job ' + data.job_id + ' running…';
        const poll = setInterval(async () => {
          try {
            const jr = await fetch('/api/ops/judge/jobs/' + data.job_id);
            if (!jr.ok) { clearInterval(poll); return; }
            const job = await jr.json();
            st.textContent = 'Judge job ' + data.job_id + ': ' +
              (job.status_line || job.status);
            if (job.status === 'done') {
              clearInterval(poll);
              st.textContent = 'Judged ' + (job.judgments_stored || 0) +
                ' row(s). Refreshing…';
              await onSelectionChange();
              btn.disabled = false;
            } else if (job.status === 'error' || job.status === 'aborted') {
              clearInterval(poll);
              st.textContent = 'Judge job ' + job.status + ': ' +
                (job.error || '');
              btn.disabled = false;
            }
          } catch (err) { clearInterval(poll); btn.disabled = false; }
        }, 2000);
      } catch (err) {
        st.textContent = 'Failed: ' + err;
        btn.disabled = false;
      }
    }

    document.getElementById('judge-btn').addEventListener('click',
      () => dispatchJudge());
    document.getElementById('judge-warn-go').addEventListener('click',
      () => dispatchJudge({allow_contestant_judge: true}));

    loadRuns();
    loadSuites().catch(err => {
      document.getElementById('status').textContent = 'Failed to load suites: ' + err;
    });
  </script>
  </main>

</body>
</html>
